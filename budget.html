<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://campusbite.xyz/">
  <meta charset="UTF-8"/>
  <title>Your Budget – Campus Bite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/tent.jpeg">
  <link rel="apple-touch-icon" href="images/tent.jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Poppins,sans-serif;
  background:#0f0f0f;
  color:#eee;
  padding-bottom:160px;
}

/* App bar */
header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 16px;
  background:#141414;
}
header img{
  width:36px;height:36px;border-radius:8px
}
header h1{
  font-size:1.25rem;
  color:#ff914d;
}
.back{
  margin-left:auto;
  color:#aaa;
  text-decoration:none;
  font-weight:600;
}

/* Budget cards */
.container{padding:16px}
.budget-item{
  background:#1a1a1a;
  border-radius:18px;
  padding:14px;
  margin-bottom:14px;
  display:flex;
  gap:14px;
}
.item-img{
  width:80px;height:80px;
  border-radius:14px;
  object-fit:cover;
}
.item-info{flex:1}
.item-name{font-weight:600;font-size:1.05rem}
.item-price{color:#aaa;font-size:.9rem;margin:2px 0}

.qty-row{
  display:flex;
  align-items:center;
  gap:14px;
  margin:8px 0;
}
.qty-row button{
  width:34px;height:34px;
  border:none;
  border-radius:10px;
  font-size:20px;
  font-weight:700;
  background:#ff914d;
  color:#000;
  cursor:pointer;
}
.qty-row span{
  min-width:24px;
  text-align:center;
  font-weight:600;
}
.subtotal{color:#ff914d;font-weight:600;font-size:.9rem}

/* Total */
.total{
  margin-top:18px;
  background:#141414;
  padding:16px;
  border-radius:18px;
  font-size:1.3rem;
  font-weight:600;
  color:#ff914d;
}

/* Action buttons */
.actions{
  display:flex;
  gap:14px;
  margin-top:18px;
}
.actions button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
}
.back-btn{background:#ff914d;color:#000}
.checkout-btn{background:#4CAF50;color:#000}

/* Footer */
footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#141414;
  padding:14px 10px 18px;
}
.footer-nav{
  display:flex;
  justify-content:space-around;
  margin-bottom:12px;
}
.footer-nav a{
  color:#4CAF50;
  text-decoration:none;
  font-size:.75rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.contact-info{
  text-align:center;
  font-size:.85rem;
}
.contact-info a{color:#4CAF50;text-decoration:none}
.legal{
  text-align:center;
  font-size:.75rem;
  color:#888;
  margin-top:8px;
}

/* Modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal.hidden{display:none}
.modal-box{
  background:#1a1a1a;
  padding:20px;
  border-radius:18px;
  text-align:center;
}
.modal-box button{
  margin:10px;
  padding:10px 18px;
  border:none;
  border-radius:10px;
  font-weight:600;
}
.yes{background:#4CAF50}
.no{background:#ff5a5a}
</style>
</head>

<body>

<header>
  <img src="images/tent.jpeg">
  <h1>Campus Bite</h1>
  <a href="home.html" class="back">← Back</a>
</header>

<div class="container" id="list"></div>
<div class="container">
  <div class="total" id="grandTotal"></div>

  <div class="actions">
    <button class="back-btn" onclick="goBack()">Add More Items</button>
    <button class="checkout-btn" onclick="checkout()">Proceed to Checkout ✔</button>
  </div>
</div>

<!-- Modal -->
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <p id="modalMsg"></p>
    <button class="yes" id="yesBtn">Yes</button>
    <button class="no" id="noBtn">No</button>
  </div>
</div>

<footer>
  <nav class="footer-nav">
    <a href="/profile.html"><i class="fa fa-user"></i><span>Profile</span></a>
    <a href="/home.html"><i class="fa fa-utensils"></i><span>Menu</span></a>
    <a href="/confirm-order.html"><i class="fa fa-shopping-cart"></i><span>Cart</span></a>
    <a href="/order-history.html"><i class="fa fa-list"></i><span>My Orders</span></a>
    <a href="/comments.html"><i class="fa fa-comments"></i><span>Comments</span></a>
  </nav>

  <div class="contact-info">
    <p>📞 <a href="tel:+256748372023">+256 748 372 023</a></p>
    <p>✉️ <a href="mailto:campusbite@muni.ac.ug">campusbite@muni.ac.ug</a></p>
  </div>

  <p class="legal">© 2026 Campus Bite. All rights reserved.<br>Muni University | Arua, Uganda</p>
</footer>

<script>
const KEY="campusbite_budget_items_v1";
const PLACEHOLDER="images/placeholder.png";
const list=document.getElementById("list");
const totalEl=document.getElementById("grandTotal");

function load(){
  const items=JSON.parse(localStorage.getItem(KEY)||"{}");
  list.innerHTML="";
  let total=0;

  Object.entries(items).forEach(([name,i])=>{
    const sub=i.qty*i.price;
    total+=sub;

    list.innerHTML+=`
      <div class="budget-item">
        <img class="item-img" src="${i.img||PLACEHOLDER}">
        <div class="item-info">
          <div class="item-name">${name}</div>
          <div class="item-price">UGX ${i.price.toLocaleString()}</div>
          <div class="qty-row">
            <button onclick="update('${name}',-1)">−</button>
            <span>${i.qty}</span>
            <button onclick="update('${name}',1)">+</button>
          </div>
          <div class="subtotal">Subtotal: UGX ${sub.toLocaleString()}</div>
        </div>
      </div>`;
  });

  totalEl.textContent=total?"Total: UGX "+total.toLocaleString():"Your budget is empty";
}

function update(name,delta){
  const items=JSON.parse(localStorage.getItem(KEY)||"{}");
  if(!items[name])return;
  items[name].qty+=delta;
  if(items[name].qty<=0) delete items[name];
  localStorage.setItem(KEY,JSON.stringify(items));
  load();
}

function goBack(){location.href="home.html"}
function checkout(){location.href="confirm-order.html"}

load();
</script>

</body>
</html>
