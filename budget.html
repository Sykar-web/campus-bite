<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://campusbite.xyz/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Campus Bite – Your Budget</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="images/tent.jpeg" type="image/jpeg">
  <link rel="apple-touch-icon" href="images/tent.jpeg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#fff8f1;
  --card:#ffffff;
  --primary:#ff914d;
  --primary-dark:#ff6a00;
  --text:#333;
  --muted:#666;
  --radius:14px;
  --shadow:0 6px 16px rgba(0,0,0,.08);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
}

.container{
  max-width:720px;
  width:100%;
  padding:16px 18px 24px;
  display:flex;
  flex-direction:column;
}

/* App bar */
.appbar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
}
.appbar img{
  width:34px;height:34px;border-radius:8px;object-fit:cover;
}
.appbar h1{
  font-size:1.4rem;
  color:var(--primary-dark);
}

/* Main cart container */
.cart{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px;
  margin-top:10px;
}

.cart-item{
  display:flex;
  gap:12px;
  padding:12px 0;
}
.cart-item:not(:last-child){
  border-bottom:1px solid #f0f0f0;
}

.item-img{
  width:70px;
  height:70px;
  border-radius:12px;
  object-fit:cover;
  background:#eee;
  flex-shrink:0;
}

.item-info{
  flex:1;
}
.item-name{font-weight:600}
.item-price{font-size:.85rem;color:var(--muted);margin-top:2px}

.qty-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}

.qty-btn{
  width:32px;
  height:32px;
  border:none;
  border-radius:8px;
  background:var(--primary);
  color:#fff;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}
.qty-btn:hover{background:var(--primary-dark)}

.qty{
  min-width:22px;
  text-align:center;
  font-weight:600;
}

.subtotal{
  font-size:.9rem;
  font-weight:600;
  margin-top:6px;
}

/* Total + actions */
.summary{
  margin-top:16px;
  text-align:right;
  font-size:1.2rem;
  font-weight:600;
  color:var(--primary-dark);
}

.actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}
.actions button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
  font-size:1rem;
}
.back-btn{background:var(--primary);color:#fff}
.checkout-btn{background:#4CAF50;color:#fff}
.actions button:hover{opacity:.9}
button:disabled{opacity:.6;cursor:not-allowed}

/* Footer (UNCHANGED, EXACT) */
footer{
  margin-top:26px;
  padding:20px;
  background:#fff;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.footer-nav{
  display:flex;
  justify-content:space-around;
  flex-wrap:wrap;
  gap:8px 14px;
  margin-bottom:14px;
}
.footer-nav a{
  text-decoration:none;
  color:#4CAF50;
  font-weight:500;
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 10px;
  border-radius:8px;
}
.footer-nav a:hover{background:#f6f6f6}
.contact-info{text-align:center;margin-top:6px}
.contact-info a{color:#4CAF50;font-weight:600;text-decoration:none}
.legal{text-align:center;margin-top:10px;font-size:.9rem;color:#666}
</style>
</head>

<body>
<div class="container">

  <div class="appbar">
    <img src="images/tent.jpeg" alt="Campus Bite">
    <h1>Your Budget</h1>
  </div>

  <div class="cart" id="cart"></div>

  <div class="summary" id="grandTotal">UGX 0</div>

  <div class="actions">
    <button class="back-btn" onclick="goBack()">← Add More</button>
    <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">Proceed to Checkout ✅</button>
  </div>

  <!-- FOOTER (exact) -->
  <footer>
    <nav class="footer-nav" aria-label="Bottom navigation">
      <a href="/profile.html"><i class="fa fa-user"></i><span>Profile</span></a>
      <a href="/home.html"><i class="fa fa-utensils"></i><span>Menu</span></a>
      <a href="/confirm-order.html"><i class="fa fa-shopping-cart"></i><span>Cart</span></a>
      <a href="/order-history.html"><i class="fa fa-list"></i><span>My Orders</span></a>
      <a href="/comments.html"><i class="fa fa-comments"></i><span>Comments</span></a>
    </nav>

    <div class="contact-info">
      <p>📞 <a href="tel:+256748372023">+256 748 372 023</a></p>
      <p>✉️ <a href="mailto:campusbite@muni.ac.ug">campusbite@muni.ac.ug</a></p>
    </div>

    <p class="legal">© 2026 Campus Bite. All rights reserved.<br/>Muni University | Arua, Uganda</p>
  </footer>

</div>

<script>
const STORAGE_KEY="campusbite_budget_items_v1";
const PLACEHOLDER="images/placeholder.png";
const cartEl=document.getElementById("cart");
const totalEl=document.getElementById("grandTotal");
const checkoutBtn=document.getElementById("checkoutBtn");

function load(){
  const raw=localStorage.getItem(STORAGE_KEY);
  const items=raw?JSON.parse(raw):{};
  cartEl.innerHTML="";
  let total=0;

  if(Object.keys(items).length===0){
    cartEl.innerHTML="<p style='text-align:center;color:#666'>Your budget is empty.</p>";
    totalEl.textContent="";
    checkoutBtn.disabled=true;
    return;
  }

  checkoutBtn.disabled=false;

  Object.keys(items).forEach(name=>{
    const it=items[name];
    const sub=it.qty*it.price;
    total+=sub;

    const div=document.createElement("div");
    div.className="cart-item";
    div.innerHTML=`
      <img class="item-img" src="${it.img||PLACEHOLDER}">
      <div class="item-info">
        <div class="item-name">${name}</div>
        <div class="item-price">UGX ${it.price.toLocaleString()}</div>

        <div class="qty-row">
          <button class="qty-btn" onclick="changeQty('${name}',-1)">−</button>
          <div class="qty">${it.qty}</div>
          <button class="qty-btn" onclick="changeQty('${name}',1)">+</button>
        </div>

        <div class="subtotal">Subtotal: UGX ${sub.toLocaleString()}</div>
      </div>
    `;
    cartEl.appendChild(div);
  });

  totalEl.textContent="Total: UGX "+total.toLocaleString();
}

function changeQty(name,delta){
  const items=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
  if(!items[name]) return;
  items[name].qty+=delta;
  if(items[name].qty<=0) delete items[name];
  localStorage.setItem(STORAGE_KEY,JSON.stringify(items));
  load();
}

function goBack(){ location.href="home.html"; }
function checkout(){ location.href="confirm-order.html"; }

load();
</script>
</body>
</html>
