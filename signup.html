<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | Campus Bite</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff914d">
  <link rel="icon" href="/images/tent.jpeg" type="image/jpeg">
  <link rel="apple-touch-icon" href="/images/tent.jpeg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --brand: #ff914d;
      --brand-dark: #e67e39;
      --text-main: #1a1a1a;
      --text-muted: #666;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-color: #000;
      position: relative;
    }

    .bg-wrapper { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
    .moving-bg {
      width: 110%; height: 110%; position: absolute; top: -5%; left: -5%;
      background: url("https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1950&q=80") center/cover no-repeat;
      animation: kenBurns 20s infinite alternate ease-in-out;
    }
    @keyframes kenBurns { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.1) translate(-2%, -2%); } }
    .overlay { position: fixed; inset: 0; z-index: -1; background: rgba(0, 0, 0, 0.5); }

    .auth-container { width: 100%; max-width: 440px; padding: 20px; z-index: 2; animation: fadeIn 0.8s ease-out; }
    .auth-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(15px);
      padding: 30px 40px;
      border-radius: 30px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .auth-card h1 { font-family: 'Poppins', sans-serif; font-size: 1.7rem; color: var(--text-main); margin-bottom: 5px; }
    .auth-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }

    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .input-wrapper { position: relative; margin-bottom: 12px; text-align: left; }
    .input-wrapper i.field-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 0.9rem; }
    
    .eye-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #aaa; font-size: 0.9rem; }

    .input-wrapper input, .input-wrapper select {
      width: 100%; padding: 12px 35px 12px 40px;
      border: 1.5px solid #eee; border-radius: 12px;
      font-size: 0.9rem; outline: none; transition: 0.3s; background: #fafafa;
    }
    .input-wrapper input:focus, .input-wrapper select:focus { border-color: var(--brand); background: #fff; }

    .primary-btn { width: 100%; padding: 14px; background: var(--brand); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 5px; }
    .primary-btn:hover { background: var(--brand-dark); transform: translateY(-1px); }

    /* Success Modal Styles */
    #successModal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: white; padding: 40px; border-radius: 25px; text-align: center;
      max-width: 320px; animation: scaleUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .modal-content i { font-size: 4rem; color: #4CAF50; margin-bottom: 15px; }
    .install-btn { 
      background: #000; color: #fff; border: none; padding: 12px 20px; 
      border-radius: 10px; margin-top: 15px; width: 100%; cursor: pointer; font-weight: 600;
    }

    .footer-text { margin-top: 15px; font-size: 0.85rem; color: var(--text-muted); }
    .footer-text a { color: var(--brand); text-decoration: none; font-weight: 600; }

    @keyframes scaleUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 480px) { .input-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="bg-wrapper">
    <div class="moving-bg"></div>
  </div>
  <div class="overlay"></div>

  <div id="successModal">
    <div class="modal-content">
      <i class="fa-solid fa-circle-check"></i>
      <h2 style="margin-bottom: 10px;">Welcome!</h2>
      <p id="modalMsg">Account created successfully.</p>
      <button id="installAppBtn" class="install-btn" style="display: none;">Install Campus Bite App</button>
      <button onclick="window.location.href='home.html'" class="primary-btn" style="background: #eee; color: #333; margin-top: 10px;">Continue to Home</button>
    </div>
  </div>

  <div class="auth-container">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p>Join the Muni University food community</p>

      <div class="input-wrapper">
        <i class="fa-regular fa-user field-icon"></i>
        <input type="text" id="name" placeholder="Name" />
      </div>

      <div class="input-wrapper">
        <i class="fa-regular fa-envelope field-icon"></i>
        <input type="email" id="email" placeholder="Email" />
      </div>

      <div class="input-wrapper">
        <i class="fa-solid fa-phone field-icon"></i>
        <input type="tel" id="phone" placeholder="Phone Number " />
      </div>

      <div class="input-row">
        <div class="input-wrapper">
          <i class="fa-solid fa-graduation-cap field-icon"></i>
          <select id="faculty">
            <option value="" disabled selected>Faculty</option>
            <option value="Technoscience">Technoscience</option>
            <option value="Business">Management</option>
            <option value="Health">Health Science</option>
            <option value="Education">Education</option>
            <option value="Agriculture">Agriculture</option>
          </select>
        </div>
        <div class="input-wrapper">
          <i class="fa-solid fa-book-open field-icon"></i>
          <input type="text" id="course" placeholder="Course" />
        </div>
      </div>

      <div class="input-wrapper">
        <i class="fa-solid fa-hotel field-icon"></i>
        <input type="text" id="hostel" placeholder="Hostel Name" />
      </div>

      <div class="input-wrapper">
        <i class="fa-solid fa-lock field-icon"></i>
        <input type="password" id="password" placeholder="Create Password" />
        <i class="fa-regular fa-eye eye-toggle" id="togglePassword"></i>
      </div>

      <button class="primary-btn" id="signupBtn">Sign Up Now</button>
      
      <div class="footer-text">
        Joined already? <a href="index.html">Sign In</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, setDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI",
      authDomain: "campus-bite-9dbaa.firebaseapp.com",
      projectId: "campus-bite-9dbaa",
      storageBucket: "campus-bite-9dbaa.appspot.com",
      messagingSenderId: "294389261625",
      appId: "1:294389261625:web:095d6e5f85f4e8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // PWA Install Logic
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Only show install button if they aren't in standalone mode
      if (!window.matchMedia('(display-mode: standalone)').matches) {
        document.getElementById('installAppBtn').style.display = 'block';
      }
    });

    document.getElementById('installAppBtn').onclick = async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('installAppBtn').style.display = 'none';
        }
        deferredPrompt = null;
      }
    };

    // Password Toggle Logic
    const passwordInput = document.getElementById("password");
    const toggleBtn = document.getElementById("togglePassword");
    toggleBtn.onclick = () => {
      const type = passwordInput.type === "password" ? "text" : "password";
      passwordInput.type = type;
      toggleBtn.classList.toggle("fa-eye");
      toggleBtn.classList.toggle("fa-eye-slash");
    };

    // Signup Logic
    document.getElementById("signupBtn").onclick = async () => {
      const btn = document.getElementById("signupBtn");
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const faculty = document.getElementById("faculty").value;
      const course = document.getElementById("course").value.trim();
      const hostel = document.getElementById("hostel").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!name || !email || !phone || !faculty || !course || !hostel || !password) {
        return alert("Please complete all fields.");
      }

      btn.disabled = true;
      btn.innerText = "Processing...";

      try {
        const res = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "students", res.user.uid), {
          name, email, phone, faculty, course, hostel, uid: res.user.uid, createdAt: serverTimestamp()
        });
        
        // Show Success Modal instead of Alert
        document.getElementById("successModal").style.display = "flex";
        
      } catch (e) {
        alert(e.message);
        btn.disabled = false;
        btn.innerText = "Sign Up Now";
      }
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
