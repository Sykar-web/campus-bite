<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://campusbite.xyz/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Details | Campus Bite</title>
  
  <link rel="icon" href="/images/tent.jpeg" type="image/jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="manifest" href="/manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ff914d">

  <style>
    :root { --brand: #ff914d; --brand-dark: #e67e39; --glass: rgba(255, 255, 255, 0.96); }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body { min-height: 100vh; background-color: #000; color: #fff; overflow-x: hidden; }

    .bg-wrapper { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
    #mealBg {
      width: 110%; height: 110%; position: absolute; top: -5%; left: -5%;
      background-size: cover; background-position: center; filter: brightness(0.4);
      animation: kenBurns 20s infinite alternate ease-in-out;
    }

    @keyframes kenBurns { 0% { transform: scale(1); } 100% { transform: scale(1.1) translate(-1%, -1%); } }

    #overlay { position: relative; z-index: 1; padding: 40px 20px; max-width: 750px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-family: 'Poppins', sans-serif; color: var(--brand); font-size: 1.8rem; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .subtitle { font-size: 0.8rem; opacity: 0.8; letter-spacing: 1px; text-transform: uppercase; }

    .meal-details {
      background: var(--glass); color: #1a1a1a; border-radius: 32px; padding: 30px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5); backdrop-filter: blur(12px);
    }

    .action-bar { display: flex; gap: 12px; margin-bottom: 30px; }
    
    button {
      flex: 1; padding: 14px; border: none; border-radius: 14px;
      font-weight: 600; cursor: pointer; display: flex;
      align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
    }

    button.favorite { background: var(--brand); color: white; }
    button.share { background: #f0f0f0; color: #444; }
    button:active { transform: scale(0.96); }

    h3 { font-family: 'Poppins', sans-serif; margin: 25px 0 15px; color: #333; font-size: 1.1rem; }
    h3 i { color: var(--brand); margin-right: 8px; }

    li { margin-bottom: 12px; line-height: 1.5; font-size: 0.95rem; display: flex; align-items: flex-start; gap: 12px; }
    .ingredient-check { accent-color: var(--brand); width: 18px; height: 18px; margin-top: 2px; }
    .step-num { background: var(--brand); color: white; min-width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; }

    /* Reviews */
    .comments-section { margin-top: 40px; border-top: 1px solid #eee; padding-top: 25px; }
    .comment { background: #f8f9fa; padding: 15px; border-radius: 16px; margin-bottom: 12px; border: 1px solid #efefef; }
    .comment strong { color: var(--brand); font-size: 0.8rem; }
    
    textarea { 
      width: 100%; padding: 15px; border-radius: 16px; border: 1.5px solid #eee; 
      background: #fafafa; outline: none; transition: 0.3s; resize: none; font-size: 0.9rem;
    }
    textarea:focus { border-color: var(--brand); background: #fff; }

    footer { text-align: center; margin-top: 50px; font-size: 0.75rem; opacity: 0.5; padding-bottom: 30px; }
  </style>
</head>
<body>

<div class="bg-wrapper"><div id="mealBg"></div></div>

<div id="overlay">
  <header>
    <h1 id="mealTitleDisplay">Loading...</h1>
    <p class="subtitle">Campus Bite Kitchen • Muni University</p>
  </header>

  <main id="mealContainer">
    </main>

  <footer>© 2026 Campus Bite | Arua, Uganda</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="/ingredients.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI",
    authDomain: "campus-bite-9dbaa.firebaseapp.com",
    projectId: "campus-bite-9dbaa"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const params = new URLSearchParams(window.location.search);
  const selectedMealName = params.get("meal");
  const container = document.getElementById("mealContainer");
  const mealBg = document.getElementById("mealBg");

  auth.onAuthStateChanged(user => {
    if(!user) { window.location.href="login.html"; return; }
    loadMeal(user);
  });

  function loadMeal(user) {
    // 1. Find meal in the array (imported from ingredients.js)
    const meal = typeof meals !== 'undefined' ? meals.find(m => m.name === selectedMealName) : null;
    
    if(!meal) {
      container.innerHTML = `<div class="meal-details" style="text-align:center;"><h3>Meal not found</h3><a href="home.html" style="color:var(--brand)">Return to Menu</a></div>`;
      return;
    }

    document.getElementById("mealTitleDisplay").innerText = meal.name;
    mealBg.style.backgroundImage = `url('${meal.img || '/images/tent.jpeg'}')`;

    container.innerHTML = `
      <div class="meal-details">
        <div class="action-bar">
          <button class="favorite" id="favoriteBtn"><i class="fa-solid fa-heart"></i> Favorite</button>
          <button class="share" id="shareBtn"><i class="fa-solid fa-link"></i> Share</button>
        </div>
        
        <h3><i class="fa-solid fa-list-check"></i> Ingredients</h3>
        <ul>${(meal.ingredients || []).map(i => `<li><input type="checkbox" class="ingredient-check"> ${i}</li>`).join('')}</ul>
        
        <h3><i class="fa-solid fa-fire-burner"></i> Method</h3>
        <ol>${(meal.steps || []).map((s, idx) => `<li><span class="step-num">${idx+1}</span> ${s}</li>`).join('')}</ol>
        
        <div class="comments-section">
          <h3><i class="fa-solid fa-star"></i> Student Reviews</h3>
          <div id="commentsContainer">Loading reviews...</div>
          <form id="commentForm" style="margin-top:20px;">
            <textarea id="commentInput" rows="2" placeholder="How did it taste?"></textarea>
            <button type="submit" class="favorite" style="width:auto; padding: 12px 25px; margin-top:10px;">Post Review</button>
          </form>
        </div>
      </div>
    `;

    // Favorites Logic
    document.getElementById("favoriteBtn").onclick = async () => {
      try {
        await db.collection("users").doc(user.uid).collection("favorites").doc(meal.name).set({
          mealName: meal.name,
          savedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("Added to your favorites! ❤️");
      } catch(e) { console.error(e); }
    };

    // Share Logic
    document.getElementById("shareBtn").onclick = () => {
      navigator.clipboard.writeText(window.location.href);
      alert("Link copied to clipboard! 🔗");
    };

    // Real-time Comments
    const commCont = document.getElementById("commentsContainer");
    const commForm = document.getElementById("commentForm");
    
    db.collection("meals").doc(meal.name).collection("comments").orderBy("timestamp","desc").limit(10)
      .onSnapshot(snap => {
        commCont.innerHTML = snap.empty ? '<p style="color:#999; font-size:0.8rem; text-align:center;">No reviews yet. Be the first!</p>' : '';
        snap.forEach(doc => {
          const d = doc.data();
          const commentDiv = document.createElement("div");
          commentDiv.className = "comment";
          commentDiv.innerHTML = `<strong>@${d.userId}</strong><p>${d.text}</p>`;
          commCont.appendChild(commentDiv);
        });
      });

    commForm.onsubmit = async (e) => {
      e.preventDefault();
      const val = document.getElementById("commentInput").value.trim();
      if(!val) return;
      
      try {
        await db.collection("meals").doc(meal.name).collection("comments").add({
          userId: user.email.split('@')[0],
          text: val,
          timestamp: Date.now()
        });
        document.getElementById("commentInput").value = "";
      } catch(e) { alert("Error posting review."); }
    };
  }

  // PWA SW
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
