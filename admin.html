<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Executive Admin | Campus Bite</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="manifest" href="/manifest.json">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="images/tent.jpeg">
  <meta name="theme-color" content="#ff914d">

  <style>
    :root { --primary: #ff914d; --dark: #121212; --bg: #f8fafb; --white: #ffffff; --red: #ff4d4d; --green: #2ecc71; --blue: #2563eb; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--dark); padding-bottom: 90px; }

    /* Sidebar Navigation */
    .sidebar { width: 280px; background: var(--dark); height: 100vh; position: fixed; left: 0; top: 0; padding: 40px 25px; color: white; display: none; z-index: 1000; }
    .main-wrapper { width: 100%; transition: 0.3s; }
    @media (min-width: 1024px) { .sidebar { display: block; } .main-wrapper { margin-left: 280px; width: calc(100% - 280px); } }

    /* Header & Stats */
    .header-gradient { background: linear-gradient(135deg, #121212 0%, #2c2c2c 100%); padding: 60px 25px 100px; color: white; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; max-width: 1100px; margin: 30px auto -140px; }
    .stat-card { background: var(--white); color: var(--dark); padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; border: 1px solid #f0f0f0; }
    .stat-card span { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .stat-card h2 { color: var(--primary); font-size: 1.4rem; margin-top: 5px; }

    /* Search */
    .search-wrapper { max-width: 700px; margin: 160px auto 40px; padding: 0 20px; }
    .search-bar { background: var(--white); padding: 18px 25px; border-radius: 25px; display: flex; align-items: center; box-shadow: 0 15px 35px rgba(0,0,0,0.04); border: 1px solid #eee; }
    .search-bar input { border: none; outline: none; width: 100%; margin-left: 15px; font-size: 0.95rem; }

    /* Content Area */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .view-section { display: none; animation: fadeIn 0.4s ease; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Card Designs */
    .order-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .order-card { background: var(--white); border-radius: 25px; padding: 22px; border: 1px solid #eee; cursor: pointer; transition: 0.3s; }
    .order-card:hover { border-color: var(--primary); transform: translateY(-5px); }
    
    .student-item { background: white; padding: 15px 25px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; cursor: pointer; transition: 0.2s; }
    .student-item:hover { border-color: var(--primary); background: #fffaf7; }

    /* Badges */
    .badge { padding: 6px 14px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .pending { background: #fff9c4; color: #fbc02d; border: 1px solid #fbc02d; }
    .preparing { background: #e3f2fd; color: var(--blue); border: 1px solid var(--blue); }
    .delivered { background: #e8f5e9; color: #2e7d32; border: 1px solid #2e7d32; }

    /* Modals */
    .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--white); width: 100%; max-width: 550px; padding: 35px; border-radius: 35px; max-height: 85vh; overflow-y: auto; position: relative; }
    .close-modal { position: absolute; top: 25px; right: 25px; font-size: 1.5rem; color: #ccc; cursor: pointer; }
    
    .edit-input { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #eee; border-radius: 12px; font-family: inherit; font-size: 0.9rem; outline-color: var(--primary); }
    .label-small { font-size: 0.65rem; color: #aaa; font-weight: 700; text-transform: uppercase; }

    .btn-save { width: 100%; padding: 16px; background: var(--dark); color: white; border: none; border-radius: 18px; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .btn-verify { width: 100%; padding: 12px; background: var(--green); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn-notify { width: 100%; padding: 12px; background: var(--blue); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }

    .nav-item { padding: 15px 20px; border-radius: 15px; color: #888; display: flex; align-items: center; gap: 15px; cursor: pointer; margin-bottom: 8px; text-decoration: none; }
    .nav-item.active { background: rgba(255,145,77,0.15); color: var(--primary); font-weight: 600; }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--white); display: flex; justify-content: space-around; padding: 15px; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); z-index: 900; border-top-left-radius: 30px; border-top-right-radius: 30px; }
    @media (min-width: 1024px) { .bottom-nav { display: none; } }
    .nav-btn { text-align: center; color: #ccc; font-size: 0.7rem; cursor: pointer; }
    .nav-btn.active { color: var(--primary); font-weight: 700; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div style="text-align:center; margin-bottom:50px;"><h2 style="color:var(--primary);">Campus Bite</h2><p style="font-size:0.6rem; color:#666;">Admin Dashboard v4.2</p></div>
  <div class="nav-item active" onclick="switchView('orders', this)"><i class="fa fa-shopping-cart"></i> Live Orders</div>
  <div class="nav-item" onclick="switchView('students', this)"><i class="fa fa-users"></i> Students List</div>
  <div class="nav-item" onclick="switchView('comments', this)"><i class="fa fa-comment-alt"></i> Feedback</div>
  <a href="home.html" class="nav-item" style="margin-top:40px;"><i class="fa fa-sign-out-alt"></i> Exit Admin</a>
</aside>

<div class="main-wrapper">
  <header class="header-gradient">
    <div style="max-width:1100px; margin:0 auto;">
      <h1 id="viewTitle">Live Orders</h1>
      <p style="opacity:0.6; font-size:0.9rem;">Real-time business oversight</p>
      <div class="stats-container">
        <div class="stat-card"><span>Active</span><h2 id="statActive">0</h2></div>
        <div class="stat-card"><span>Revenue</span><h2 id="statRevenue">UGX 0</h2></div>
        <div class="stat-card"><span>Students</span><h2 id="statStudents">0</h2></div>
      </div>
    </div>
  </header>

  <section class="search-wrapper">
    <div class="search-bar">
      <i class="fa fa-search" style="color:var(--primary)"></i>
      <input type="text" id="adminSearch" placeholder="Search orders, names, or hostels..." onkeyup="filterData()">
    </div>
  </section>

  <div class="container">
    <section id="ordersView" class="view-section active"><div class="order-grid" id="orderList"></div></section>
    <section id="studentsView" class="view-section"><div id="studentList" style="max-width:850px; margin:0 auto;"></div></section>
    <section id="commentsView" class="view-section"><div id="commentList" style="max-width:850px; margin:0 auto;"></div></section>
  </div>
</div>

<div id="studentModal" class="modal">
  <div class="modal-content">
    <i class="fa fa-times close-modal" onclick="closeModals()"></i>
    <div style="text-align: center; margin-bottom: 25px;">
        <div id="sInitials" style="width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; margin: 0 auto 10px;"></div>
        <h3 id="sNameDisplay">Student Profile</h3>
        <p id="sID" style="font-size: 0.7rem; color: #888;"></p>
    </div>
    
    <label class="label-small">Full Name</label>
    <input type="text" id="editSName" class="edit-input">
    <label class="label-small">Phone Number</label>
    <input type="text" id="editSPhone" class="edit-input">
    <label class="label-small">Hostel / Hall</label>
    <input type="text" id="editSHostel" class="edit-input">
    <label class="label-small">Department / Course</label>
    <input type="text" id="editSDepartment" class="edit-input">
    <label class="label-small">Email (Read-only)</label>
    <p id="displaySEmail" style="font-size: 0.9rem; padding: 10px 0; font-weight: 600;"></p>
    
    <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button id="btnSaveStudent" class="btn-save">Save Changes</button>
        <a id="sCallBtn" href="#" class="btn-save" style="text-align: center; text-decoration: none; background: var(--green);">Call Now</a>
    </div>
  </div>
</div>

<div id="orderModal" class="modal">
  <div class="modal-content">
    <i class="fa fa-times close-modal" onclick="closeModals()"></i>
    <div style="display:flex; justify-content:space-between;">
        <div><h3 id="mOrderID">Order Details</h3><p id="mCustomerName" style="color:var(--primary); font-weight:600;"></p></div>
        <div id="mContactActions"></div>
    </div>
    <div id="orderBody" style="margin-top:20px;"></div>
    <div id="mPaymentSection" style="margin-top:20px;"></div>
    <button class="btn-verify" id="btnConfirmPayment">Mark as Paid (Verified)</button>
    <div style="margin-top:25px; border-top:1px solid #eee; padding-top:20px;">
      <label class="label-small">Status & Alerts</label>
      <select id="mStatus" class="edit-input">
        <option value="pending">Pending</option>
        <option value="preparing">Preparing</option>
        <option value="out-for-delivery">Out for Delivery</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <button class="btn-save" id="btnUpdateStatus">Update Status</button>
      <button class="btn-notify" id="btnNotifyStudent" style="display:none;"><i class="fa fa-bell"></i> Send PWA Alert</button>
      <p id="notifStatus" style="font-size: 0.65rem; text-align: center; margin-top: 8px; font-weight: 600;"></p>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <div class="nav-btn active" onclick="switchView('orders', this)"><i class="fa fa-shopping-cart"></i><br>Orders</div>
  <div class="nav-btn" onclick="switchView('students', this)"><i class="fa fa-users"></i><br>Students</div>
  <div class="nav-btn" onclick="switchView('comments', this)"><i class="fa fa-comment-alt"></i><br>Feedback</div>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = { apiKey: "AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI", authDomain: "campus-bite-9dbaa.firebaseapp.com", projectId: "campus-bite-9dbaa" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  auth.onAuthStateChanged(user => {
    if(!user || user.email !== "ezrasykar@gmail.com") location.href="home.html";
    else startApp();
  });

  function startApp() {
    // 1. STUDENTS SYNC
    db.collection("students").onSnapshot(snap => {
      document.getElementById("statStudents").innerText = snap.size;
      const sList = document.getElementById("studentList");
      sList.innerHTML = "";
      snap.forEach(doc => {
        const s = doc.data(); s.id = doc.id;
        sList.innerHTML += `<div class="student-item" onclick='openStudentModal(${JSON.stringify(s)})'><div class="student-info"><h4>${s.name || 'Unknown'}</h4><p>${s.hostel || 'No Hostel'} • ${s.phone || 'No Phone'}</p></div><i class="fa fa-chevron-right" style="color:#ddd;"></i></div>`;
      });
    });

    // 2. ORDERS SYNC
    db.collectionGroup("userOrders").onSnapshot(snap => {
      const list = document.getElementById("orderList");
      list.innerHTML = ""; let rev = 0; let act = 0;
      let all = [];
      snap.forEach(doc => { 
        let d = doc.data(); d.id = doc.id; d.fullPath = doc.ref.path; d.userId = doc.ref.parent.parent.id;
        all.push(d); 
      });
      all.sort((a,b) => (a.status === 'pending' ? -1 : 1));
      all.forEach(o => {
        if(o.status === 'delivered') rev += (Number(o.totalAmount) || 0);
        if(o.status === 'pending' || o.status === 'preparing') act++;
        list.innerHTML += `<div class="order-card" onclick='openOrderModal(${JSON.stringify(o)})'><div style="display:flex; justify-content:space-between; margin-bottom:12px;"><small style="color:var(--primary); font-weight:700;">#${o.id.slice(-5).toUpperCase()}</small><span class="badge ${o.status || 'pending'}">${o.status || 'pending'}</span></div><h4>${o.userName || 'Guest'} ${o.paymentStatus === 'Paid' ? '<span class="paid-badge">PAID</span>' : ''}</h4><p style="font-size:0.8rem; color:#888;"><i class="fa fa-map-marker-alt"></i> ${o.deliveryLocation || 'N/A'}</p><div style="margin-top:15px; display:flex; justify-content:space-between; align-items:center;"><span style="font-weight:700;">UGX ${(o.totalAmount || 0).toLocaleString()}</span><small>${o.paymentMode}</small></div></div>`;
      });
      document.getElementById("statActive").innerText = act;
      document.getElementById("statRevenue").innerText = "UGX " + rev.toLocaleString();
    });

    // 3. RESTORED COMMENTS SYNC
    db.collection("comments").orderBy("createdAt", "desc").onSnapshot(snap => {
      const clist = document.getElementById("commentList");
      clist.innerHTML = "";
      snap.forEach(doc => {
        const c = doc.data();
        clist.innerHTML += `<div class="student-item" style="cursor:default;"><div><strong>${c.userName || 'User'}</strong><p>${c.text}</p></div><button onclick="deleteComment('${doc.id}')" style="border:none; color:var(--red); background:none; cursor:pointer;"><i class="fa fa-trash"></i></button></div>`;
      });
    });
  }

  // NOTIFICATION LOGIC
  async function notifyStudent(order) {
    const feedback = document.getElementById("notifStatus");
    feedback.innerText = "⏳ Connecting...";
    try {
        const studentDoc = await db.collection("students").doc(order.userId).get();
        if (!studentDoc.exists || !studentDoc.data().fcmToken) {
            feedback.innerText = "❌ No Token Found (PWA alert disabled)"; feedback.style.color = "var(--red)"; return;
        }
        feedback.innerText = `✅ Alert queued for ${order.userName}!`; feedback.style.color = "var(--green)";
    } catch (e) { feedback.innerText = "❌ Error."; }
  }

  function openOrderModal(o) {
    document.getElementById("mOrderID").innerText = "Order #" + o.id.slice(-5).toUpperCase();
    document.getElementById("mCustomerName").innerText = o.userName || "Customer";
    document.getElementById("mStatus").value = o.status || "pending";
    document.getElementById("notifStatus").innerText = "";

    // Notification Button Logic
    const notifyBtn = document.getElementById("btnNotifyStudent");
    if (o.userId) {
        notifyBtn.style.display = "block";
        notifyBtn.onclick = () => notifyStudent(o);
    }

    // Contact Actions (Call/SMS)
    const phone = o.deliveryPhone || "";
    document.getElementById("mContactActions").innerHTML = phone ? `
        <a href="tel:${phone}" style="color:var(--green); font-size:1.4rem; margin-right:15px;"><i class="fa fa-phone-alt"></i></a>
        <a href="sms:${phone}" style="color:var(--primary); font-size:1.4rem;"><i class="fa fa-comment-dots"></i></a>
    ` : "";

    // RESTORED: Payment Section with Transaction ID
    let paymentHtml = "";
    if (o.paymentMode === "Mobile Money") {
        paymentHtml = `
            <div style="background:#eef2ff; border:1px solid #c7d2fe; padding:15px; border-radius:18px; margin-bottom:15px;">
                <label class="label-small" style="color:#4338ca;">Mobile Money Transaction</label>
                <div style="font-weight:700; color:#1e1b4b; font-size:1rem; margin:5px 0;">ID: ${o.transactionId || 'NOT PROVIDED'}</div>
                <div style="font-size:0.75rem; color:#4338ca;">Status: ${o.paymentStatus || 'Unpaid'}</div>
            </div>`;
    } else {
        paymentHtml = `
            <div style="background:#f9f9f9; padding:12px; border-radius:15px; text-align:center; margin-bottom:15px;">
                <span class="label-small">Cash on Delivery</span> • <strong>${o.paymentStatus || 'Unpaid'}</strong>
            </div>`;
    }
    document.getElementById("mPaymentSection").innerHTML = paymentHtml;

    // RESTORED: Order Items with Images
    document.getElementById("orderBody").innerHTML = `
      <div style="margin-bottom:15px;">
        <label class="label-small">Delivery Location</label><br>
        <strong style="font-size:0.9rem;"><i class="fa fa-map-marker-alt" style="color:var(--red)"></i> ${o.deliveryLocation || 'N/A'}</strong>
      </div>
      <div style="background:#f9f9f9; padding:15px; border-radius:20px;">
        ${(o.items || []).map(i => `
          <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px; border-bottom:1px solid #eee; padding-bottom:12px;">
            <img src="${i.img || i.image || 'images/tent.jpeg'}" 
                 style="width:45px; height:45px; border-radius:10px; object-fit:cover; background:#eee;"
                 onerror="this.src='images/tent.jpeg'">
            <div style="flex:1;">
                <div style="font-size:0.85rem; font-weight:600;">${i.name}</div>
                <small style="color:#888;">Qty: ${i.qty}</small>
            </div>
            <strong style="font-size:0.85rem;">UGX ${(i.price * i.qty).toLocaleString()}</strong>
          </div>`).join('')}
        <div style="text-align:right; color:var(--primary); font-weight:700; font-size:1.1rem; margin-top:5px;">
            Total: UGX ${(o.totalAmount || 0).toLocaleString()}
        </div>
      </div>`;

    // Button Actions
    document.getElementById("btnConfirmPayment").onclick = async () => {
        await db.doc(o.fullPath).update({ paymentStatus: 'Paid' });
        alert("Payment verified successfully!");
        closeModals();
    };

    document.getElementById("btnUpdateStatus").onclick = async () => {
        await db.doc(o.fullPath).update({ status: document.getElementById("mStatus").value });
        alert("Order status updated.");
    };

    document.getElementById("orderModal").style.display = "flex";
}

  function openStudentModal(s) {
    document.getElementById("sInitials").innerText = (s.name || "U")[0].toUpperCase();
    document.getElementById("sNameDisplay").innerText = s.name || "Unknown";
    document.getElementById("sID").innerText = "UID: " + s.id;
    document.getElementById("displaySEmail").innerText = s.email || 'N/A';
    document.getElementById("editSName").value = s.name || "";
    document.getElementById("editSPhone").value = s.phone || "";
    document.getElementById("editSHostel").value = s.hostel || "";
    document.getElementById("editSDepartment").value = s.department || "";
    document.getElementById("sCallBtn").href = "tel:" + s.phone;
    document.getElementById("btnSaveStudent").onclick = async () => {
        await db.collection("students").doc(s.id).update({ name: document.getElementById("editSName").value, phone: document.getElementById("editSPhone").value, hostel: document.getElementById("editSHostel").value, department: document.getElementById("editSDepartment").value });
        alert("Saved!"); closeModals();
    };
    document.getElementById("studentModal").style.display = "flex";
  }

  function switchView(view, el) {
    document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item, .nav-btn').forEach(i => i.classList.remove('active'));
    document.getElementById(view + 'View').classList.add('active'); el.classList.add('active');
    document.getElementById('viewTitle').innerText = view === 'orders' ? 'Live Orders' : (view === 'students' ? 'Students List' : 'User Feedback');
  }

  function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = "none"); }
  async function deleteComment(id) { if(confirm("Delete this?")) await db.collection("comments").doc(id).delete(); }
  function filterData() {
    const q = document.getElementById("adminSearch").value.toLowerCase();
    document.querySelectorAll(".order-card, .student-item").forEach(c => { c.style.display = c.innerText.toLowerCase().includes(q) ? "" : "none"; });
  }
</script>
</body>
</html>
