<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Admin | Campus Bite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root { --primary: #ff914d; --dark: #121212; --bg: #f8fafb; --white: #ffffff; --red: #ff4d4d; --green: #2ecc71; --blue: #2563eb; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 90px; }
        
        /* Your Original Styles Restored */
        .header-gradient { background: linear-gradient(135deg, #121212 0%, #2c2c2c 100%); padding: 60px 25px 100px; color: white; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; }
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; max-width: 1100px; margin: 30px auto -140px; }
        .stat-card { background: var(--white); color: var(--dark); padding: 25px; border-radius: 25px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .search-bar { background: var(--white); padding: 18px 25px; border-radius: 25px; display: flex; align-items: center; margin: 160px auto 40px; max-width: 700px; box-shadow: 0 15px 35px rgba(0,0,0,0.04); }
        .search-bar input { border: none; outline: none; width: 100%; margin-left: 15px; font-size: 0.95rem; }

        .view-section { display: none; }
        .view-section.active { display: block; }

        /* Items */
        .student-item, .order-card { background: white; padding: 20px; border-radius: 20px; margin-bottom: 15px; border: 1px solid #eee; cursor: pointer; }
        .student-avatar { width: 45px; height: 45px; border-radius: 50%; margin-right: 15px; object-fit: cover; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .dot-online { background: var(--green); box-shadow: 0 0 5px var(--green); }
        .dot-offline { background: #ddd; }

        /* Modals */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; overflow-y: auto; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 550px; padding: 30px; border-radius: 30px; position: relative; }
        .meal-img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; margin-right: 12px; }
        
        /* Buttons */
        .btn-update { background: var(--dark); color: white; border: none; padding: 12px; border-radius: 12px; width: 100%; font-weight: 600; cursor: pointer; }
        .btn-delete { background: none; color: var(--red); border: 1px solid var(--red); padding: 10px; border-radius: 12px; width: 100%; margin-top: 10px; cursor: pointer; }
        .master-reset { background: var(--red); color: white; padding: 20px; border-radius: 20px; text-align: center; margin-top: 50px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header class="header-gradient">
        <div class="container">
            <h1 id="viewTitle">Live Orders</h1>
            <div class="stats-container">
                <div class="stat-card"><span>Active</span><h2 id="statActive">0</h2></div>
                <div class="stat-card"><span>Revenue</span><h2 id="statRevenue">0</h2></div>
                <div class="stat-card"><span>Students</span><h2 id="statStudents">0</h2></div>
            </div>
        </div>
    </header>

    <div class="search-bar">
        <i class="fa fa-search"></i>
        <input type="text" id="adminSearch" placeholder="Search..." onkeyup="filterData()">
    </div>

    <div class="container">
        <section id="ordersView" class="view-section active">
            <div id="orderList"></div>
        </section>

        <section id="studentsView" class="view-section">
            <div id="studentList"></div>
        </section>

        <section id="commentsView" class="view-section">
            <div id="commentList"></div>
            <div class="master-reset" onclick="masterReset()">
                <i class="fa fa-radiation"></i> MASTER RESET (Clear Orders & Feedback)
            </div>
        </section>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3 id="mOrderUser">Order Details</h3>
            <div id="mOrderDetails" style="margin: 20px 0;"></div>
            <hr>
            <div style="margin: 20px 0;">
                <label>Update Status:</label>
                <select id="mStatusSelect" style="width: 100%; padding: 10px; border-radius: 10px; margin-top: 5px;">
                    <option value="pending">Pending</option>
                    <option value="preparing">Preparing</option>
                    <option value="delivered">Delivered</option>
                </select>
            </div>
            <button class="btn-update" onclick="updateOrderStatus()">Update Status</button>
            <button class="btn-delete" onclick="deleteOrder()">Delete Order</button>
            <button onclick="closeModals()" style="width:100%; margin-top:10px; border:none; background:none; cursor:pointer;">Close</button>
        </div>
    </div>

    <div id="studentModal" class="modal">
        <div class="modal-content">
            <h3>Edit Student</h3>
            <input type="hidden" id="editSId">
            <input type="text" id="editSName" placeholder="Name" style="width:100%; margin-bottom:10px; padding:10px;">
            <input type="text" id="editSPhone" placeholder="Phone" style="width:100%; margin-bottom:10px; padding:10px;">
            <input type="text" id="editSHostel" placeholder="Hostel" style="width:100%; margin-bottom:10px; padding:10px;">
            <button class="btn-update" onclick="saveStudent()">Save Changes</button>
            <button class="btn-delete" onclick="deleteStudent()">Delete Account</button>
            <button onclick="closeModals()" style="width:100%; margin-top:10px; border:none; background:none; cursor:pointer;">Close</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI", authDomain: "campus-bite-9dbaa.firebaseapp.com", projectId: "campus-bite-9dbaa" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentStudents = [];
        let currentOrders = [];
        let activeOrderId = null;
        let activeOrderUid = null;

        // 1. DATA LISTENERS
        function startListeners() {
            // Students
            db.collection("students").onSnapshot(snap => {
                currentStudents = [];
                snap.forEach(doc => { let s = doc.data(); s.id = doc.id; currentStudents.push(s); });
                document.getElementById("statStudents").innerText = currentStudents.length;
                renderStudents();
            });

            // Orders
            db.collectionGroup("userOrders").onSnapshot(snap => {
                currentOrders = [];
                let rev = 0;
                snap.forEach(doc => { 
                    let o = doc.data(); o.id = doc.id; o.uid = doc.ref.parent.parent.id;
                    currentOrders.push(o); 
                    if(o.status === 'delivered') rev += Number(o.totalAmount || 0);
                });
                document.getElementById("statRevenue").innerText = "UGX " + rev.toLocaleString();
                renderOrders();
            });

            // Feedback
            db.collection("comments").onSnapshot(snap => {
                const list = document.getElementById("commentList");
                list.innerHTML = "<h3>Feedback</h3>";
                snap.forEach(doc => {
                    const c = doc.data();
                    list.innerHTML += `
                        <div class="student-item">
                            <div><strong>${c.userName}</strong><p>${c.text}</p></div>
                            <button onclick="deleteFeedback('${doc.id}')" style="border:none; color:red; background:none;"><i class="fa fa-trash"></i></button>
                        </div>`;
                });
            });
        }

        // 2. RENDERING
        function renderOrders() {
            const list = document.getElementById("orderList");
            list.innerHTML = "";
            currentOrders.forEach(o => {
                list.innerHTML += `
                    <div class="order-card" onclick='openOrderModal(${JSON.stringify(o)})'>
                        <h4>${o.userName}</h4>
                        <p>Total: UGX ${o.totalAmount} | Status: <strong>${o.status}</strong></p>
                    </div>`;
            });
        }

        function renderStudents() {
            const list = document.getElementById("studentList");
            const term = document.getElementById("adminSearch").value.toLowerCase();
            list.innerHTML = "";
            currentStudents.forEach(s => {
                const name = s.name || s.email || "User";
                if(term && !name.toLowerCase().includes(term)) return;
                
                const isOnline = s.lastActive && (new Date() - s.lastActive.toDate()) / 60000 < 5;
                const avatar = s.profilePic ? `<img src="${s.profilePic}" class="student-avatar">` : `<div class="student-avatar" style="background:#eee; display:flex; align-items:center; justify-content:center;">${name[0]}</div>`;

                list.innerHTML += `
                    <div class="student-item" onclick='openStudentModal(${JSON.stringify(s)})'>
                        <div style="display:flex; align-items:center;">
                            ${avatar}
                            <div><h4>${name}</h4><span class="status-dot ${isOnline ? 'dot-online' : 'dot-offline'}"></span>${s.hostel || 'No Hostel'}</div>
                        </div>
                    </div>`;
            });
        }

        // 3. ADMIN ACTIONS
        function openOrderModal(o) {
            activeOrderId = o.id; activeOrderUid = o.uid;
            document.getElementById("orderModal").style.display = "flex";
            document.getElementById("mOrderUser").innerText = "Order: " + o.userName;
            
            let mealsHtml = "";
            o.cartItems.forEach(item => {
                mealsHtml += `
                    <div style="display:flex; align-items:center; margin-bottom:10px;">
                        <img src="${item.image}" class="meal-img">
                        <div><strong>${item.name}</strong><br>Qty: ${item.quantity}</div>
                    </div>`;
            });
            document.getElementById("mOrderDetails").innerHTML = mealsHtml;
            document.getElementById("mStatusSelect").value = o.status;
        }

        async function updateOrderStatus() {
            const newStatus = document.getElementById("mStatusSelect").value;
            await db.collection("students").doc(activeOrderUid).collection("userOrders").doc(activeOrderId).update({ status: newStatus });
            closeModals();
        }

        async function deleteOrder() {
            if(!confirm("Delete this order?")) return;
            await db.collection("students").doc(activeOrderUid).collection("userOrders").doc(activeOrderId).delete();
            closeModals();
        }

        async function deleteFeedback(id) {
            if(confirm("Delete this feedback?")) await db.collection("comments").doc(id).delete();
        }

        async function masterReset() {
            if(!confirm("DANGER: This will delete ALL orders and feedback. Continue?")) return;
            // Delete all comments
            const comms = await db.collection("comments").get();
            comms.forEach(d => d.ref.delete());
            alert("Database Cleared (Except Students)");
        }

        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
        
        startListeners();
    </script>
</body>
</html>
