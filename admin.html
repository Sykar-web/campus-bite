<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Executive Admin | Campus Bite</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="manifest" href="/manifest.json">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="images/tent.jpeg">
  <meta name="theme-color" content="#ff914d">

  <style>
    :root { --primary: #ff914d; --dark: #121212; --bg: #f8fafb; --white: #ffffff; --red: #ff4d4d; --green: #2ecc71; --blue: #2563eb; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--dark); padding-bottom: 90px; }

    /* Sidebar Navigation */
    .sidebar { width: 280px; background: var(--dark); height: 100vh; position: fixed; left: 0; top: 0; padding: 40px 25px; color: white; display: none; z-index: 1000; }
    .main-wrapper { width: 100%; transition: 0.3s; }
    @media (min-width: 1024px) { .sidebar { display: block; } .main-wrapper { margin-left: 280px; width: calc(100% - 280px); } }

    /* Header & Stats */
    .header-gradient { background: linear-gradient(135deg, #121212 0%, #2c2c2c 100%); padding: 60px 25px 100px; color: white; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; max-width: 1100px; margin: 30px auto -140px; }
    .stat-card { background: var(--white); color: var(--dark); padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; border: 1px solid #f0f0f0; }
    .stat-card span { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .stat-card h2 { color: var(--primary); font-size: 1.4rem; margin-top: 5px; }

    /* Search & Filters */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding: 5px 0; }
    .f-btn { padding: 10px 20px; border-radius: 25px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.3s; white-space: nowrap; }
    .f-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .search-wrapper { max-width: 700px; margin: 160px auto 40px; padding: 0 20px; }
    .search-bar { background: var(--white); padding: 18px 25px; border-radius: 25px; display: flex; align-items: center; box-shadow: 0 15px 35px rgba(0,0,0,0.04); border: 1px solid #eee; }
    .search-bar input { border: none; outline: none; width: 100%; margin-left: 15px; font-size: 0.95rem; }

    /* Activity Indicators */
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot-online { background-color: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot-offline { background-color: #bbb; }
    .last-seen-text { font-size: 0.65rem; color: #888; font-weight: 400; }

    /* Content Layout */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .view-section { display: none; animation: fadeIn 0.4s ease; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .order-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .order-card { background: var(--white); border-radius: 25px; padding: 22px; border: 1px solid #eee; cursor: pointer; transition: 0.3s; border-left: 5px solid transparent; }
    .order-card:hover { border-color: var(--primary); transform: translateY(-5px); }
    
    .student-item { background: white; padding: 15px 25px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; transition: 0.2s; cursor: pointer; }
    .student-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-right: 12px; border: 2px solid #eee; }

    .badge { padding: 6px 14px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .pending { background: #fff9c4; color: #fbc02d; border: 1px solid #fbc02d; }
    .preparing { background: #e3f2fd; color: var(--blue); border: 1px solid var(--blue); }
    .delivered { background: #e8f5e9; color: #2e7d32; border: 1px solid #2e7d32; }
    .paid-badge { background: var(--green); color: white; padding: 2px 8px; border-radius: 6px; font-size: 0.6rem; margin-left: 5px; vertical-align: middle; }

    /* Modals */
    .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--white); width: 100%; max-width: 550px; padding: 35px; border-radius: 35px; max-height: 85vh; overflow-y: auto; position: relative; }
    .close-modal { position: absolute; top: 25px; right: 25px; font-size: 1.5rem; color: #ccc; cursor: pointer; }
    .edit-input { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #eee; border-radius: 12px; font-family: inherit; font-size: 0.9rem; outline-color: var(--primary); }
    .label-small { font-size: 0.65rem; color: #aaa; font-weight: 700; text-transform: uppercase; }

    /* Buttons */
    .btn-save { width: 100%; padding: 16px; background: var(--dark); color: white; border: none; border-radius: 18px; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .btn-verify { width: 100%; padding: 12px; background: var(--green); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn-notify { width: 100%; padding: 12px; background: var(--blue); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-delete { width: 100%; padding: 12px; background: var(--red); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px; }

    /* Navigation */
    .nav-item { padding: 15px 20px; border-radius: 15px; color: #888; display: flex; align-items: center; gap: 15px; cursor: pointer; margin-bottom: 8px; text-decoration: none; }
    .nav-item.active { background: rgba(255,145,77,0.15); color: var(--primary); font-weight: 600; }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--white); display: flex; justify-content: space-around; padding: 15px; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); z-index: 900; border-top-left-radius: 30px; border-top-right-radius: 30px; }
    @media (min-width: 1024px) { .bottom-nav { display: none; } }
    .nav-btn { text-align: center; color: #ccc; font-size: 0.7rem; cursor: pointer; }
    .nav-btn.active { color: var(--primary); font-weight: 700; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div style="text-align:center; margin-bottom:50px;"><h2 style="color:var(--primary);">Campus Bite</h2><p style="font-size:0.6rem; color:#666;">Admin Dashboard v5.2</p></div>
  <div class="nav-item active" onclick="switchView('orders', this)"><i class="fa fa-shopping-cart"></i> Live Orders</div>
  <div class="nav-item" onclick="switchView('students', this)"><i class="fa fa-users"></i> Students List</div>
  <div class="nav-item" onclick="switchView('comments', this)"><i class="fa fa-comment-alt"></i> Feedback</div>
  <a href="home.html" class="nav-item" style="margin-top:40px;"><i class="fa fa-sign-out-alt"></i> Exit Admin</a>
</aside>

<div class="main-wrapper">
  <header class="header-gradient">
    <div style="max-width:1100px; margin:0 auto;">
      <h1 id="viewTitle">Live Orders</h1>
      <div class="stats-container">
        <div class="stat-card"><span>Active</span><h2 id="statActive">0</h2></div>
        <div class="stat-card"><span>Revenue</span><h2 id="statRevenue">UGX 0</h2></div>
        <div class="stat-card"><span>Students</span><h2 id="statStudents">0</h2></div>
        <div class="stat-card" id="exportBtn" style="cursor:pointer; border: 1px solid var(--primary);">
            <span style="color:var(--primary)">Export Data</span>
            <h2 style="font-size: 1.1rem; margin-top:5px;"><i class="fa fa-file-excel"></i> CSV</h2>
        </div>
      </div>
    </div>
  </header>

  <section class="search-wrapper">
    <div class="search-bar"><i class="fa fa-search" style="color:var(--primary)"></i><input type="text" id="adminSearch" placeholder="Search orders or students..." onkeyup="filterData()"></div>
  </section>

  <div class="container">
    <section id="ordersView" class="view-section active">
        <div class="filter-bar">
            <button class="f-btn active" onclick="setFilter('all', this)">All</button>
            <button class="f-btn" onclick="setFilter('unpaid', this)">Unpaid</button>
            <button class="f-btn" onclick="setFilter('paid', this)">Paid</button>
        </div>
        <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
            <button onclick="toggleDelivered()" style="background: none; border: 1px solid var(--red); color: var(--red); padding: 8px 15px; border-radius: 12px; font-size: 0.8rem; cursor: pointer; font-weight: 600;">
                <i class="fa fa-broom"></i> Hide Delivered
            </button>
        </div>
        <div class="order-grid" id="orderList"></div>
    </section>

    <section id="studentsView" class="view-section">
        <div id="studentList" style="max-width:850px; margin:0 auto;"></div>
    </section>
    
    <section id="commentsView" class="view-section">
        <div style="background: white; padding: 25px; border-radius: 25px; margin-bottom: 20px; border: 1px solid #eee;">
            <h4 style="margin-bottom: 15px; font-size: 0.95rem;"><i class="fa fa-download" style="color: var(--blue);"></i> Data Export Center</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                <button onclick="exportData('orders')" class="f-btn">Orders</button>
                <button onclick="exportData('comments')" class="f-btn">Feedback</button>
                <button onclick="exportData('students')" class="f-btn">Students</button>
            </div>
        </div>
        <div id="commentList" style="max-width:850px; margin:0 auto;"></div>
        <div class="reset-box" style="text-align:center; margin-top:40px; padding:25px; border:2px dashed var(--red); border-radius:20px; background: #fff;">
            <h4 style="color:var(--red);">Master System Reset</h4>
            <button onclick="secureMasterReset()" class="btn-delete" style="max-width:250px; margin: 10px auto;">Clear Orders & Chat</button>
        </div>
    </section>
  </div>
</div>

<div id="studentModal" class="modal">
  <div class="modal-content">
    <i class="fa fa-times close-modal" onclick="closeModals()"></i>
    <div style="text-align: center; margin-bottom: 25px;"><div id="sProfileIcon"></div><h3 id="sNameDisplay">Student Profile</h3></div>
    <label class="label-small">Full Name</label><input type="text" id="editSName" class="edit-input">
    <label class="label-small">Phone Number</label><input type="text" id="editSPhone" class="edit-input">
    <label class="label-small">Hostel / Hall</label><input type="text" id="editSHostel" class="edit-input">
    <label class="label-small">Department</label><input type="text" id="editSDepartment" class="edit-input">
    <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button id="btnSaveStudent" class="btn-save">Save Changes</button>
        <a id="sCallBtn" href="#" class="btn-save" style="text-align: center; text-decoration: none; background: var(--green);">Call Student</a>
    </div>
    <button id="btnDeleteStudent" class="btn-delete">Delete Account</button>
  </div>
</div>

<div id="orderModal" class="modal">
  <div class="modal-content">
    <i class="fa fa-times close-modal" onclick="closeModals()"></i>
    <h3 id="mOrderID">Order Details</h3>
    <div id="orderBody" style="margin-top:20px;"></div>
    <button class="btn-verify" id="btnConfirmPayment">Mark as Paid</button>
    <div style="margin-top:25px; border-top:1px solid #eee; padding-top:20px;">
      <select id="mStatus" class="edit-input">
        <option value="pending">Pending</option>
        <option value="preparing">Preparing</option>
        <option value="out-for-delivery">Out for Delivery</option>
        <option value="delivered">Delivered</option>
      </select>
      <button class="btn-save" id="btnUpdateStatus">Update Status</button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <div class="nav-btn active" onclick="switchView('orders', this)"><i class="fa fa-shopping-cart"></i><br>Orders</div>
  <div class="nav-btn" onclick="switchView('students', this)"><i class="fa fa-users"></i><br>Students</div>
  <div class="nav-btn" onclick="switchView('comments', this)"><i class="fa fa-comment-alt"></i><br>Feedback</div>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = { apiKey: "AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI", authDomain: "campus-bite-9dbaa.firebaseapp.com", projectId: "campus-bite-9dbaa" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  let currentStudents = [];
  let currentOrdersSnap = null;
  let hideDelivered = false;
  let currentFilter = 'all';
  let firstLoad = true;
  let lastOrderCount = 0;
  const chime = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

  auth.onAuthStateChanged(user => {
    if(!user || user.email !== "ezrasykar@gmail.com") location.href="home.html";
    else startApp();
  });

  function startApp() {
    // REAL-TIME STUDENTS LISTENER
    db.collection("students").onSnapshot(snap => {
      currentStudents = [];
      snap.forEach(doc => { let s = doc.data(); s.id = doc.id; currentStudents.push(s); });
      document.getElementById("statStudents").innerText = currentStudents.length;
      renderStudents();
    });

    // REAL-TIME ORDERS LISTENER
    db.collectionGroup("userOrders").onSnapshot(snap => {
      if (!firstLoad && snap.size > lastOrderCount) chime.play().catch(e => {});
      lastOrderCount = snap.size; firstLoad = false;
      currentOrdersSnap = snap;
      renderOrders(snap);
    });

    // REAL-TIME COMMENTS LISTENER
    db.collection("comments").orderBy("createdAt", "desc").onSnapshot(snap => {
      const clist = document.getElementById("commentList"); clist.innerHTML = "";
      snap.forEach(doc => {
        const c = doc.data();
        clist.innerHTML += `<div class="student-item" style="cursor:default;"><div><strong>${c.userName || 'User'}</strong><p>${c.text}</p></div><button onclick="deleteComment('${doc.id}')" style="border:none; color:var(--red); background:none; cursor:pointer;"><i class="fa fa-trash"></i></button></div>`;
      });
    });
  }

  function renderStudents() {
    const sList = document.getElementById("studentList");
    const searchTerm = document.getElementById("adminSearch").value.toLowerCase();
    sList.innerHTML = "";

    currentStudents.forEach(s => {
      if (searchTerm && !s.name?.toLowerCase().includes(searchTerm) && !s.hostel?.toLowerCase().includes(searchTerm)) return;

      // Activity Logic
      const now = new Date();
      const lastSeen = s.lastActive ? s.lastActive.toDate() : null;
      let activityHtml = `<span class="last-seen-text">Never seen</span>`;
      
      if (lastSeen) {
          const diff = Math.floor((now - lastSeen) / 60000);
          if (diff < 5) activityHtml = `<span class="status-dot dot-online"></span><span class="last-seen-text" style="color:var(--green); font-weight:600;">Active Now</span>`;
          else activityHtml = `<span class="status-dot dot-offline"></span><span class="last-seen-text">${diff < 60 ? diff+'m' : Math.floor(diff/60)+'h'} ago</span>`;
      }

      const avatar = s.profilePic ? `<img src="${s.profilePic}" class="student-avatar">` : `<div style="width:40px;height:40px;background:var(--primary);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;margin-right:12px;">${(s.name || "U")[0].toUpperCase()}</div>`;
      
      sList.innerHTML += `
        <div class="student-item" onclick='openStudentModal(${JSON.stringify(s)})'>
          <div style="display:flex;align-items:center;">
            ${avatar}
            <div><h4>${s.name || 'Unknown'}</h4>${activityHtml}</div>
          </div>
          <div style="text-align:right;"><p style="font-size:0.7rem; color:#666;">${s.hostel || 'N/A'}</p><i class="fa fa-chevron-right" style="color:#eee;"></i></div>
        </div>`;
    });
  }

  function renderOrders(snap) {
      const list = document.getElementById("orderList");
      const searchTerm = document.getElementById("adminSearch").value.toLowerCase();
      list.innerHTML = ""; let rev = 0; let act = 0; let all = [];
      
      snap.forEach(doc => {
        let d = doc.data(); d.id = doc.id;
        if(currentFilter === 'unpaid' && d.paymentStatus === 'Paid') return;
        if(currentFilter === 'paid' && d.paymentStatus !== 'Paid') return;
        if(hideDelivered && d.status === 'delivered') return;
        if(searchTerm && !d.userName?.toLowerCase().includes(searchTerm)) return;
        all.push(d);
      });

      all.sort((a,b) => (a.status === 'pending' ? -1 : 1)).forEach(o => {
        if(o.status === 'delivered') rev += (Number(o.totalAmount) || 0);
        if(o.status === 'pending' || o.status === 'preparing') act++;
        let color = o.status === 'delivered' ? 'var(--green)' : 'var(--primary)';
        list.innerHTML += `
          <div class="order-card" style="border-left-color:${color}" onclick='openOrderModal(${JSON.stringify(o)})'>
            <div style="display:flex;justify-content:space-between;"><small>#${o.id.slice(-5).toUpperCase()}</small><span class="badge ${o.status}">${o.status}</span></div>
            <h4>${o.userName} ${o.paymentStatus === 'Paid' ? '<span class="paid-badge">PAID</span>' : ''}</h4>
            <p style="font-size:0.8rem; color:#666;">UGX ${(o.totalAmount || 0).toLocaleString()}</p>
          </div>`;
      });
      document.getElementById("statActive").innerText = act;
      document.getElementById("statRevenue").innerText = "UGX " + rev.toLocaleString();
  }

  function filterData() {
      renderStudents();
      if(currentOrdersSnap) renderOrders(currentOrdersSnap);
  }

  function switchView(viewId, el) {
    document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
    document.getElementById(viewId + 'View').classList.add('active');
    document.querySelectorAll('.nav-item, .nav-btn').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    document.getElementById("viewTitle").innerText = el.innerText;
  }

  function setFilter(type, el) {
    currentFilter = type;
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    if(currentOrdersSnap) renderOrders(currentOrdersSnap);
  }

  function toggleDelivered() {
    hideDelivered = !hideDelivered;
    if(currentOrdersSnap) renderOrders(currentOrdersSnap);
  }

  function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
  
  // Modal openers (simplified for demo)
  function openStudentModal(s) {
    document.getElementById("studentModal").style.display = "flex";
    document.getElementById("editSName").value = s.name || '';
    document.getElementById("editSPhone").value = s.phone || '';
    document.getElementById("sCallBtn").href = "tel:" + s.phone;
  }
</script>
</body>
</html>
