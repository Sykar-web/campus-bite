<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Executive Admin | Campus Bite</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    :root { --primary: #ff914d; --dark: #121212; --bg: #f8fafb; --white: #ffffff; --red: #ff4d4d; --green: #2ecc71; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--dark); padding-bottom: 90px; }

    /* Layout & Sidebar */
    .sidebar { width: 280px; background: var(--dark); height: 100vh; position: fixed; left: 0; top: 0; padding: 40px 25px; color: white; display: none; z-index: 1000; }
    .main-wrapper { width: 100%; transition: 0.3s; }
    @media (min-width: 1024px) { .sidebar { display: block; } .main-wrapper { margin-left: 280px; width: calc(100% - 280px); } }

    /* Header */
    .header-gradient { background: linear-gradient(135deg, #121212 0%, #2c2c2c 100%); padding: 60px 25px 100px; color: white; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; max-width: 1100px; margin: 30px auto -140px; }
    .stat-card { background: var(--white); color: var(--dark); padding: 25px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; border: 1px solid #f0f0f0; }
    .stat-card span { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .stat-card h2 { color: var(--primary); font-size: 1.4rem; margin-top: 5px; }

    /* Search Section */
    .search-wrapper { max-width: 700px; margin: 160px auto 40px; padding: 0 20px; }
    .search-bar { background: var(--white); padding: 18px 25px; border-radius: 25px; display: flex; align-items: center; box-shadow: 0 15px 35px rgba(0,0,0,0.04); border: 1px solid #eee; }
    .search-bar input { border: none; outline: none; width: 100%; margin-left: 15px; font-size: 0.95rem; }

    /* Content Area */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .view-section { display: none; animation: fadeIn 0.4s ease; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Orders UI */
    .order-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .order-card { background: var(--white); border-radius: 25px; padding: 22px; border: 1px solid #eee; cursor: pointer; transition: 0.3s; position: relative; }
    .order-card:hover { border-color: var(--primary); transform: translateY(-5px); }
    .badge { padding: 6px 14px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .pending { background: #fff9c4; color: #fbc02d; border: 1px solid #fbc02d; }
    .delivered { background: #e8f5e9; color: #2e7d32; }

    /* Students UI */
    .student-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
    .student-card { background: var(--white); border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 18px; border: 1px solid #eee; cursor: pointer; transition: 0.2s; }
    .student-card:hover { border-color: var(--primary); background: #fffcfb; }
    .avatar { width: 60px; height: 60px; background: #fff5f0; color: var(--primary); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.3rem; }

    /* Comments UI */
    .comment-card { background: var(--white); border-radius: 22px; padding: 25px; margin-bottom: 18px; border-left: 6px solid var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.02); display: flex; justify-content: space-between; align-items: center; }
    .comment-content { flex-grow: 1; margin-right: 20px; }
    .comment-content h4 { font-size: 1rem; margin-bottom: 5px; }
    .comment-content p { color: #666; font-size: 0.9rem; line-height: 1.6; }
    .btn-delete { background: #fff1f1; color: var(--red); border: none; width: 45px; height: 45px; border-radius: 15px; cursor: pointer; transition: 0.2s; font-size: 1.1rem; }
    .btn-delete:hover { background: var(--red); color: white; }

    /* Modal System */
    .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--white); width: 100%; max-width: 550px; padding: 35px; border-radius: 35px; max-height: 85vh; overflow-y: auto; position: relative; }
    .close-modal { position: absolute; top: 25px; right: 25px; font-size: 1.5rem; color: #ccc; cursor: pointer; }
    
    /* Form Elements */
    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; font-size: 0.75rem; font-weight: 600; color: #aaa; margin-bottom: 6px; text-transform: uppercase; }
    .input-group input, .input-group select { width: 100%; padding: 14px; border-radius: 15px; border: 1px solid #f0f0f0; background: #fcfcfc; font-family: inherit; font-size: 0.95rem; }
    .btn-save { width: 100%; padding: 16px; background: var(--dark); color: white; border: none; border-radius: 18px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.3s; }
    .btn-save:hover { background: var(--primary); }

    /* Navigation */
    .nav-item { padding: 15px 20px; border-radius: 15px; color: #888; display: flex; align-items: center; gap: 15px; cursor: pointer; margin-bottom: 8px; transition: 0.2s; }
    .nav-item.active { background: rgba(255,145,77,0.15); color: var(--primary); font-weight: 600; }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--white); display: flex; justify-content: space-around; padding: 15px; box-shadow: 0 -10px 30px rgba(0,0,0,0.05); z-index: 900; border-top-left-radius: 30px; border-top-right-radius: 30px; }
    .nav-btn { text-align: center; color: #ccc; font-size: 0.7rem; }
    .nav-btn.active { color: var(--primary); font-weight: 700; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div style="text-align:center; margin-bottom:50px;"><h2 style="color:var(--primary);">Campus Bite</h2><p style="font-size:0.6rem; color:#666;">Admin Dashboard v3.0</p></div>
  <div class="nav-item active" onclick="switchView('orders', this)"><i class="fa fa-shopping-cart"></i> Live Orders</div>
  <div class="nav-item" onclick="switchView('students', this)"><i class="fa fa-users"></i> Students List</div>
  <div class="nav-item" onclick="switchView('comments', this)"><i class="fa fa-comment-alt"></i> Feedback</div>
  <a href="home.html" class="nav-item" style="margin-top:40px;"><i class="fa fa-sign-out-alt"></i> Exit Admin</a>
</aside>

<div class="main-wrapper">
  <header class="header-gradient">
    <div style="max-width:1100px; margin:0 auto;">
      <h1 id="viewTitle">Live Orders</h1>
      <p style="opacity:0.6; font-size:0.9rem;">Manage your business in real-time</p>
      
      <div class="stats-container">
        <div class="stat-card"><span>Active</span><h2 id="statActive">0</h2></div>
        <div class="stat-card"><span>Revenue</span><h2 id="statRevenue">UGX 0</h2></div>
        <div class="stat-card"><span>Students</span><h2 id="statStudents">0</h2></div>
      </div>
    </div>
  </header>

  <section class="search-wrapper">
    <div class="search-bar">
      <i class="fa fa-search" style="color:var(--primary)"></i>
      <input type="text" id="adminSearch" placeholder="Search orders, names, or locations..." onkeyup="filterData()">
    </div>
  </section>

  <div class="container">
    <section id="ordersView" class="view-section active"><div class="order-grid" id="orderList"></div></section>
    <section id="studentsView" class="view-section"><div class="student-list" id="studentList"></div></section>
    <section id="commentsView" class="view-section"><div id="commentList" style="max-width:850px; margin:0 auto;"></div></section>
  </div>
</div>

<div id="orderModal" class="modal">
  <div class="modal-content">
    <i class="fa fa-times close-modal" onclick="closeModals()"></i>
    <h3 id="mOrderID" style="margin-bottom:20px;">Order Details</h3>
    <div id="orderBody"></div>
    <div class="input-group" style="margin-top:25px; border-top:1px solid #eee; padding-top:20px;">
      <label>Change Order Status</label>
      <select id="mStatus">
        <option value="pending">Pending</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <button class="btn-save" id="btnUpdateStatus">Update Status Now</button>
    </div>
  </div>
</div>

<div id="studentModal" class="modal">
  <div class="modal-content">
    <i class="fa fa-times close-modal" onclick="closeModals()"></i>
    <h3 style="margin-bottom:20px;">Edit Student Profile</h3>
    <input type="hidden" id="sID">
    <div class="input-group"><label>Full Name</label><input type="text" id="sName"></div>
    <div class="input-group"><label>Phone</label><input type="text" id="sPhone"></div>
    <div class="input-group"><label>Course</label><input type="text" id="sCourse"></div>
    <div class="input-group"><label>Faculty</label><input type="text" id="sFaculty"></div>
    <div class="input-group"><label>Hostel / Room</label><input type="text" id="sHostel"></div>
    <button class="btn-save" onclick="saveStudent()">Update Student Profile</button>
  </div>
</div>

<nav class="bottom-nav">
  <div class="nav-btn active" onclick="switchView('orders', this)"><i class="fa fa-shopping-cart"></i><br>Orders</div>
  <div class="nav-btn" onclick="switchView('students', this)"><i class="fa fa-users"></i><br>Students</div>
  <div class="nav-btn" onclick="switchView('comments', this)"><i class="fa fa-comment-alt"></i><br>Feedback</div>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI",
    authDomain: "campus-bite-9dbaa.firebaseapp.com",
    projectId: "campus-bite-9dbaa"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  auth.onAuthStateChanged(user => {
    if(!user || user.email !== "ezrasykar@gmail.com") location.href="home.html";
    else startApp();
  });

  function switchView(view, el) {
    document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item, .nav-btn').forEach(i => i.classList.remove('active'));
    document.getElementById(view + 'View').classList.add('active');
    el.classList.add('active');
    document.getElementById('viewTitle').innerText = (view === 'orders') ? 'Live Orders' : (view === 'students' ? 'Students List' : 'User Feedback');
  }

  function startApp() {
    // 1. REACTIVE STUDENTS
    db.collection("students").onSnapshot(snap => {
      document.getElementById("statStudents").innerText = snap.size;
      const list = document.getElementById("studentList");
      list.innerHTML = "";
      snap.forEach(doc => {
        const s = doc.data();
        list.innerHTML += `
          <div class="student-card" onclick='openStudentModal("${doc.id}", ${JSON.stringify(s)})'>
            <div class="avatar">${(s.name || 'S')[0]}</div>
            <div class="info">
              <h4 style="font-weight:600;">${s.name || 'Unknown'}</h4>
              <p style="font-size:0.8rem; color:#888;">${s.course || 'No Course'} • ${s.hostel || 'No Hostel'}</p>
            </div>
            <i class="fa fa-edit" style="margin-left:auto; color:#ddd;"></i>
          </div>`;
      });
    });

    // 2. REACTIVE ORDERS (PENDING ON TOP)
    db.collectionGroup("userOrders").onSnapshot(snap => {
      const list = document.getElementById("orderList");
      list.innerHTML = ""; let rev = 0; let act = 0;
      let all = [];
      snap.forEach(doc => { 
        let d = doc.data(); d.id = doc.id; d.fullPath = doc.ref.path; 
        all.push(d); 
      });

      // Logic: Pending first, then newest
      all.sort((a,b) => (a.status === 'pending' && b.status !== 'pending' ? -1 : 1));

      all.forEach(o => {
        if(o.status === 'delivered') rev += (Number(o.totalAmount) || 0);
        if(o.status === 'pending') act++;
        list.innerHTML += `
          <div class="order-card" onclick='openOrderModal(${JSON.stringify(o)})'>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <small style="font-weight:700; color:var(--primary);">#${o.id.slice(-5).toUpperCase()}</small>
              <span class="badge ${o.status || 'pending'}">${o.status || 'pending'}</span>
            </div>
            <h4 style="font-size:1.1rem; margin-bottom:5px;">${o.userName || 'Guest'}</h4>
            <p style="font-size:0.8rem; color:#888;"><i class="fa fa-map-marker-alt"></i> ${o.deliveryLocation || 'Campus'}</p>
            <div style="margin-top:15px; font-weight:700; font-size:1.1rem; color:var(--dark);">UGX ${(o.totalAmount || 0).toLocaleString()}</div>
          </div>`;
      });
      document.getElementById("statActive").innerText = act;
      document.getElementById("statRevenue").innerText = "UGX " + rev.toLocaleString();
    });

    // 3. REACTIVE COMMENTS
    db.collection("comments").orderBy("createdAt", "desc").onSnapshot(snap => {
      const list = document.getElementById("commentList");
      list.innerHTML = "";
      snap.forEach(doc => {
        const c = doc.data();
        list.innerHTML += `
          <div class="comment-card">
            <div class="comment-content">
              <h4>${c.userName || 'Anonymous'}</h4>
              <p>"${c.text || ''}"</p>
            </div>
            <button class="btn-delete" onclick="deleteComment('${doc.id}')"><i class="fa fa-trash-alt"></i></button>
          </div>`;
      });
    });
  }

  // --- MODAL FUNCTIONS ---
  function openOrderModal(o) {
    const body = document.getElementById("orderBody");
    document.getElementById("mOrderID").innerText = "Order #" + o.id.slice(-5).toUpperCase();
    document.getElementById("mStatus").value = o.status || "pending";
    document.getElementById("btnUpdateStatus").onclick = () => updateStatus(o.fullPath, document.getElementById("mStatus").value);

    body.innerHTML = `
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px; font-size:0.9rem;">
        <div><label style="color:#aaa; font-size:0.7rem;">PAYMENT</label><br><strong>${o.paymentMode || 'Cash'}</strong></div>
        <div><label style="color:#aaa; font-size:0.7rem;">DELIVERY FEE</label><br><strong>UGX ${(o.deliveryFee || 0).toLocaleString()}</strong></div>
      </div>
      <div style="margin-bottom:20px;"><label style="color:#aaa; font-size:0.7rem;">LOCATION</label><br><strong>${o.deliveryLocation || 'N/A'}</strong></div>
      
      <div style="background:#f9f9f9; padding:15px; border-radius:20px; max-height:250px; overflow-y:auto;">
        ${(o.items || []).map(i => `
          <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
            <img src="${i.image || i.imageUrl || i.img || 'https://via.placeholder.com/50'}" style="width:50px; height:50px; border-radius:12px; object-fit:cover;">
            <div style="flex-grow:1;"><small>${i.name}</small><br><strong>${i.qty}x</strong></div>
            <small>UGX ${(i.price * i.qty).toLocaleString()}</small>
          </div>
        `).join('')}
      </div>
    `;
    document.getElementById("orderModal").style.display = "flex";
  }

  function openStudentModal(id, s) {
    document.getElementById("sID").value = id;
    document.getElementById("sName").value = s.name || "";
    document.getElementById("sPhone").value = s.phone || "";
    document.getElementById("sCourse").value = s.course || "";
    document.getElementById("sFaculty").value = s.faculty || "";
    document.getElementById("sHostel").value = s.hostel || "";
    document.getElementById("studentModal").style.display = "flex";
  }

  function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = "none"); }

  // --- ACTIONS ---
  async function saveStudent() {
    const id = document.getElementById("sID").value;
    await db.collection("students").doc(id).update({
      name: document.getElementById("sName").value,
      phone: document.getElementById("sPhone").value,
      course: document.getElementById("sCourse").value,
      faculty: document.getElementById("sFaculty").value,
      hostel: document.getElementById("sHostel").value
    });
    alert("Profile Updated Successfully!"); closeModals();
  }

  async function deleteComment(id) { if(confirm("Permanently delete this feedback?")) await db.collection("comments").doc(id).delete(); }
  async function updateStatus(path, status) { await db.doc(path).update({ status }); closeModals(); }

  function filterData() {
    const q = document.getElementById("adminSearch").value.toLowerCase();
    document.querySelectorAll(".order-card, .student-card, .comment-card").forEach(c => {
      c.style.display = c.innerText.toLowerCase().includes(q) ? "" : "none";
    });
  }
</script>
</body>
</html>
