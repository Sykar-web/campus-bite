<!DOCTYPE html>
<html lang="en">
<head>
<link rel="canonical" href="https://campusbite.xyz/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Bite – Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="images/tent.jpeg">

<style>
:root{
  --primary:#ff6a00;
  --accent:#ff914d;
  --bg:#fff8f1;
  --card:#fff;
  --muted:#777;
  --radius:14px;
  --shadow:0 6px 18px rgba(0,0,0,.08);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:var(--bg);
  padding-bottom:140px;
}

/* App Bar */
.app-bar{
  position:sticky;
  top:0;
  z-index:100;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;
  display:flex;
  align-items:center;
  padding:14px 16px;
}
.app-bar button{
  background:none;
  border:none;
  color:#fff;
  font-size:1.2rem;
  margin-right:10px;
  cursor:pointer;
}
.app-bar h1{
  font-size:1.3rem;
  margin:0;
}

/* Cards */
.container{
  max-width:520px;
  margin:18px auto;
  padding:0 12px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  margin-bottom:18px;
}

/* Profile summary */
.profile-summary{
  text-align:center;
}
.avatar{
  width:84px;
  height:84px;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:2rem;
  font-weight:600;
  margin:0 auto 10px;
}
.profile-summary h2{
  margin:6px 0 4px;
}
.profile-summary p{
  margin:0;
  font-size:.9rem;
  color:var(--muted);
}

/* Form */
label{
  display:block;
  margin-top:14px;
  font-weight:600;
}
input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  margin-top:6px;
  font-size:.95rem;
}
input:disabled{background:#f3f3f3}

.save-btn{
  margin-top:22px;
  width:100%;
  padding:14px;
  border:none;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;
  border-radius:12px;
  font-weight:600;
  font-size:1rem;
  cursor:pointer;
}

/* Floating Orders */
.floating-btn{
  position:fixed;
  bottom:90px;
  right:18px;
  width:58px;
  height:58px;
  background:var(--accent);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
  text-decoration:none;
  color:#fff;
}
.badge{
  position:absolute;
  top:-6px;
  right:-6px;
  background:#e53935;
  color:#fff;
  font-size:.7rem;
  padding:4px 7px;
  border-radius:50%;
  font-weight:600;
}

/* Footer */
footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid #eee;
  padding:14px 10px;
  text-align:center;
  box-shadow:0 -4px 12px rgba(0,0,0,.06);
}
.footer-nav{
  display:flex;
  justify-content:space-around;
  margin-bottom:8px;
}
.footer-nav a{
  text-decoration:none;
  color:#444;
  font-size:.8rem;
  font-weight:600;
}
.footer-nav a:hover{color:var(--primary)}
.contact-info{
  font-size:.8rem;
}
.contact-info a{
  color:var(--accent);
  font-weight:600;
  text-decoration:none;
}
.legal{
  font-size:.75rem;
  color:var(--muted);
}
</style>
</head>

<body>

<!-- App Bar -->
<div class="app-bar">
  <button onclick="history.back()">←</button>
  <h1>My Profile</h1>
</div>

<div class="container">

  <!-- Profile Summary -->
  <div class="card profile-summary">
    <div class="avatar" id="avatar">U</div>
    <h2 id="displayName">User</h2>
    <p id="displayEmail">email@example.com</p>
  </div>

  <!-- Editable Info -->
  <div class="card">
    <form id="profileForm">
      <label>Phone Number</label>
      <input id="phone">

      <label>Department</label>
      <input id="department">

      <label>Gender</label>
      <select id="gender">
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>

      <label>Year of Study</label>
      <select id="year">
        <option value="">Select</option>
        <option value="1">Year 1</option>
        <option value="2">Year 2</option>
        <option value="3">Year 3</option>
        <option value="4">Year 4</option>
      </select>

      <label>New Password (optional)</label>
      <input id="password" type="password">

      <button class="save-btn">Save Changes</button>
    </form>
  </div>

</div>

<a href="order-history.html" class="floating-btn">
  🛒
  <span class="badge" id="pendingBadge">0</span>
</a>

<footer>
  <nav class="footer-nav">
    <a href="profile.html">Profile</a>
    <a href="home.html">Menu</a>
    <a href="confirm-order.html">Cart</a>
    <a href="order-history.html">Orders</a>
    <a href="comments.html">Comments</a>
  </nav>
  <div class="contact-info">
    <a href="tel:+256748372023">📞 +256 748 372 023</a> |
    <a href="mailto:campusbite@muni.ac.ug">✉️ campusbite@muni.ac.ug</a>
  </div>
  <div class="legal">© 2026 Campus Bite · Muni University</div>
</footer>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI",
  authDomain:"campus-bite-9dbaa.firebaseapp.com",
  projectId:"campus-bite-9dbaa"
});

const auth=firebase.auth();
const db=firebase.firestore();

const displayName=document.getElementById("displayName");
const displayEmail=document.getElementById("displayEmail");
const avatar=document.getElementById("avatar");
const pendingBadge=document.getElementById("pendingBadge");

auth.onAuthStateChanged(async user=>{
  if(!user) return location.href="index.html";

  displayEmail.textContent=user.email;

  const snap=await db.collection("students").doc(user.uid).get();
  if(snap.exists){
    const d=snap.data();
    displayName.textContent=d.name||"User";
    avatar.textContent=(d.name||"U")[0].toUpperCase();
    phone.value=d.phone||"";
    department.value=d.department||"";
    gender.value=d.gender||"";
    year.value=d.year||"";
  }

  const orders=await db.collection("orders").doc(user.uid).collection("userOrders").get();
  let pending=0;
  orders.forEach(o=>{
    if(o.data().status==="pending") pending+=o.data().totalAmount;
  });
  pendingBadge.textContent=pending;
});

profileForm.onsubmit=async e=>{
  e.preventDefault();
  const user=auth.currentUser;

  await db.collection("students").doc(user.uid).set({
    phone:phone.value,
    department:department.value,
    gender:gender.value,
    year:year.value,
    email:user.email
  },{merge:true});

  if(password.value.trim())
    await user.updatePassword(password.value.trim());

  alert("Profile updated successfully");
};
</script>

</body>
</html>
