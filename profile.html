<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://campusbite.xyz/">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Bite – Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="images/tent.jpeg" type="image/jpeg">
  <link rel="shortcut icon" href="images/tent.jpeg" type="image/jpeg">
  <!-- Apple / iOS icon (optional but good) -->
  <link rel="apple-touch-icon" href="images/tent.jpeg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Poppins", sans-serif; }
  body {
    background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
    background-size: cover;
    color:#333;
  }
  header {
    background: rgba(255,122,48,0.9);
    color: #fff;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  header h1 { font-size: 1.4rem; font-weight: 600; }
  header button { background: none; border: none; color: white; font-size: 1.1rem; cursor: pointer; }
  .profile-container {
    max-width: 650px;
    margin: 50px auto;
    background: rgba(255,255,255,0.95);
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  h2 { color: #ff6a00; font-size: 1.3rem; text-align: center; margin-bottom: 18px; }
  label { font-weight: 600; margin-top: 15px; display: block; }
  input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    margin-top: 6px;
    font-size: 1rem;
    background: #fff;
  }
  button.save-btn {
    margin-top: 25px;
    width: 100%;
    padding: 14px;
    border: none;
    background: #ff7a30;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1.05rem;
    font-weight: 600;
    transition: 0.25s;
  }
  button.save-btn:hover { background: #ff5400; }

  /* Floating Order History Button */
  .floating-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    background-color: #ff914d;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    transition: transform 0.2s, background-color 0.2s;
    z-index: 1000;
  }
  .floating-btn:hover {
    background-color: #ff7724;
    transform: scale(1.1);
  }
  .floating-btn .icon {
    width: 28px;
    height: 28px;
    stroke: #fff;
  }
  /* Badge for pending amount */
  .badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #ff5a5a;
    color: #fff;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 6px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>

<header>
  <h1>Profile</h1>
  <button onclick="logoutUser()">Logout</button>
</header>

<div class="profile-container">
  <h2>Profile Information</h2>
  <form id="profileForm">
    <label>Full Name</label>
    <input type="text" id="name" placeholder="Enter your full name">
    <label>Email</label>
    <input type="email" id="email" disabled>
    <label>Phone Number</label>
    <input type="text" id="phone" placeholder="Phone number">
    <label>Department</label>
    <input type="text" id="department" placeholder="Department">
    <label>Gender</label>
    <select id="gender">
      <option value="">Select gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>
    <label>Year of Study</label>
    <select id="year">
      <option value="">Select year</option>
      <option value="1">Year 1</option>
      <option value="2">Year 2</option>
      <option value="3">Year 3</option>
      <option value="4">Year 4</option>
    </select>
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter new password (optional)">
    <button class="save-btn" type="submit">Save Profile</button>
  </form>
</div>

<!-- Floating Order History Button with badge -->
<a href="order-history.html" class="floating-btn" title="View Order History">
  <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13l-1.5 7h13L17 13M7 13L5.4 5M17 13l1.5 7M6 20a1 1 0 100-2 1 1 0 000 2zm12 0a1 1 0 100-2 1 1 0 000 2z"/>
  </svg>
  <span class="badge" id="pendingBadge">0</span>
</a>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
  apiKey:"AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI",
  authDomain:"campus-bite-9dbaa.firebaseapp.com",
  projectId:"campus-bite-9dbaa",
  storageBucket:"campus-bite-9dbaa.appspot.com",
  messagingSenderId:"294389261625",
  appId:"1:294389261625:web:095d6e5f85f4e8"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

const nameInput=document.getElementById("name");
const emailInput=document.getElementById("email");
const phoneInput=document.getElementById("phone");
const departmentInput=document.getElementById("department");
const genderInput=document.getElementById("gender");
const yearInput=document.getElementById("year");
const passwordInput=document.getElementById("password");
const pendingBadge=document.getElementById("pendingBadge");

auth.onAuthStateChanged(async(user)=>{
  if(!user) return window.location.href="index.html";
  emailInput.value=user.email;

  // Load profile
  const doc=await db.collection("students").doc(user.uid).get();
  if(doc.exists){
    const d=doc.data();
    nameInput.value=d.name||"";
    phoneInput.value=d.phone||"";
    departmentInput.value=d.department||"";
    genderInput.value=d.gender||"";
    yearInput.value=d.year||"";
  }

  // Load pending orders
  const ordersSnap = await db.collection('orders').doc(user.uid).collection('userOrders').get();
  let pendingTotal = 0;
  ordersSnap.forEach(orderDoc=>{
    const o = orderDoc.data();
    if(o.status==="pending") pendingTotal += o.totalAmount;
  });
  pendingBadge.textContent = pendingTotal;
});

function logoutUser(){
  localStorage.removeItem('user');
  sessionStorage.clear();
  auth.signOut();
  window.location.href='index.html';
}

document.getElementById("profileForm").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const user=auth.currentUser;
  if(!user) return;
  try{
    await db.collection("students").doc(user.uid).set({
      name:nameInput.value,
      phone:phoneInput.value,
      department:departmentInput.value,
      gender:genderInput.value,
      year:yearInput.value,
      email:user.email
    },{merge:true});
    if(passwordInput.value.trim()!==""){
      await user.updatePassword(passwordInput.value.trim());
    }
    alert("Profile saved successfully!");
  }catch(err){
    alert("Error: "+err.message);
  }
});
</script>

</body>
</html>
