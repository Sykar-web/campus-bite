<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Confirm Order | Campus Bite</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff914d">
  <link rel="icon" href="/images/tent.jpeg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="/images/tent.jpeg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="guard.js"></script>
  <style>
    :root { --primary: #ff914d; --primary-dark: #ff6a00; --bg: #ffffff; --text: #333; --white: #fff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 120px; width: 100%; overflow-x: hidden; }

    header { background: var(--primary); color: #fff; padding: 15px 20px; display: flex; align-items: center; position: sticky; top: 0; z-index: 1000; }
    .header-logo { width: 35px; height: 35px; border-radius: 8px; margin-right: 12px; object-fit: cover; }
    header h1 { font-size: 1.1rem; flex-grow: 1; }
    .back-btn { color: white; text-decoration: none; margin-right: 15px; font-size: 1.1rem; }

    .main-content { padding: 20px; width: 100%; }
    .section-title { font-size: 0.85rem; font-weight: 700; color: #888; text-transform: uppercase; margin: 25px 0 10px; display: block; }
    
    #itemsContainer { display: grid; grid-template-columns: 1fr; gap: 15px; }
    .order-card { background: var(--white); border-radius: 15px; display: flex; align-items: center; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; }
    .item-img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; margin-right: 15px; }
    .item-details { flex: 1; }
    .item-name { font-weight: 600; font-size: 1rem; }
    .item-price { color: var(--primary); font-weight: 600; }

    .form-group, .summary-card { background: #fff; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #eee; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    .summary-card { background: #fffaf7; border-color: #ffe0cc; }
    .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .total-row { border-top: 1px dashed #ff914d; padding-top: 10px; margin-top: 10px; font-weight: 700; font-size: 1.3rem; color: var(--primary-dark); }

    input, select { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #ddd; margin-top: 8px; margin-bottom: 15px; font-family: inherit; font-size: 1rem; }

    .choice-grid { display: flex; gap: 10px; margin-bottom: 15px; }
    .choice-btn { flex: 1; padding: 12px; border-radius: 10px; border: 2px solid #eee; background: #fff; cursor: pointer; font-weight: 600; transition: 0.3s; text-align: center; }
    .choice-btn.active { border-color: var(--primary); color: var(--primary); background: #fff3ea; }

    #deliveryOptions { display: none; border-top: 1px solid #f0f0f0; padding-top: 15px; }
    .distance-alert { background: #fff3e0; padding: 12px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 15px; border-left: 4px solid var(--primary); color: #e65100; line-height: 1.4; }

    #momoWizard { display:none; background: #f0f7ff; padding: 15px; border-radius: 12px; border: 1px solid #dbeafe; }
    .net-grid { display: flex; gap: 10px; margin-bottom: 15px; }
    .net-btn { flex:1; padding: 12px; border-radius: 8px; border: 2px solid #ddd; background: #fff; font-weight: 700; cursor: pointer; }
    .net-btn.active { border-color: var(--primary); color: var(--primary); }

    #confirmOrderBtn { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 12px; width: 100%; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
    #confirmOrderBtn:disabled { background: #ccc; }

    .footer-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); z-index: 2000; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    .footer-nav a { text-decoration: none; color: #aaa; display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; }
    .footer-nav a i { font-size: 1.2rem; margin-bottom: 4px; }
    .footer-nav a.active { color: var(--primary); }
  </style>
</head>
<body>

<header>
  <a href="budget.html" class="back-btn"><i class="fa fa-chevron-left"></i></a>
  <img src="/images/tent.jpeg" class="header-logo">
  <h1>Order Finalization</h1>
</header>

<div class="main-content">
  <span class="section-title">Order Items</span>
  <div id="itemsContainer"></div>

  <span class="section-title">Delivery Method</span>
  <div class="form-group">
    <div class="choice-grid">
      <div class="choice-btn active" id="btnPickup" onclick="setMethod('pickup')"><i class="fa fa-walking"></i> Hub Pickup</div>
      <div class="choice-btn" id="btnDelivery" onclick="setMethod('delivery')"><i class="fa fa-motorcycle"></i> Door Delivery</div>
    </div>

    <div id="deliveryOptions">
      <div id="distanceInfo" class="distance-alert">
        <i class="fa fa-satellite fa-spin"></i> Estimating distance from Hub...
      </div>
      <label>Specific Room / Hostel Name</label>
      <input type="text" id="deliveryLocation" placeholder="e.g. Elite Hostel, Room 10" oninput="validate()">
    </div>
  </div>

  <span class="section-title">Customer Info</span>
  <div class="form-group">
    <label>Active Phone Number</label>
    <input type="tel" id="deliveryPhone" placeholder="07XXXXXXXX" oninput="validate()">
    
    <label>Payment Mode</label>
    <select id="paymentMode" onchange="toggleMomo()">
      <option value="Cash">Cash (On fulfillment)</option>
      <option value="Mobile Money">Mobile Money (Pre-pay)</option>
    </select>

    <div id="momoWizard">
      <div class="net-grid">
        <button class="net-btn" id="btnMTN" onclick="setNet('MTN')">MTN</button>
        <button class="net-btn" id="btnAirtel" onclick="setNet('Airtel')">Airtel</button>
      </div>
      <div id="momoActions" style="display:none; text-align:center;">
        <p style="font-size:0.8rem; margin-bottom:10px;">Dial: <strong id="ussdDisplay"></strong></p>
        <a id="payNowBtn" href="#" style="display:block; background:#22c55e; color:#fff; padding:10px; border-radius:8px; text-decoration:none; font-weight:700; margin-bottom:10px;">Open Dialer</a>
        <input type="text" id="transactionId" placeholder="Input Transaction ID" oninput="validate()">
      </div>
    </div>
  </div>

  <div class="summary-card">
    <div class="row"><span>Food Total</span><span id="subTotalDisplay">UGX 0</span></div>
    <div class="row"><span>Delivery Fee</span><span id="deliveryFeeDisplay">UGX 0</span></div>
    <div class="row total-row"><span>Total Payable</span><span id="finalTotalDisplay">UGX 0</span></div>
  </div>

  <button id="confirmOrderBtn" disabled onclick="placeOrder()">Confirm My Order</button>
</div>

<nav class="footer-nav">
  <a href="profile.html"><i class="fa fa-user"></i><span>Profile</span></a>
  <a href="home.html"><i class="fa fa-utensils"></i><span>Menu</span></a>
  <a href="budget.html" class="active"><i class="fa fa-shopping-cart"></i><span>Cart</span></a>
  <a href="order-history.html"><i class="fa fa-list"></i><span>My Orders</span></a>
  <a href="comments.html"><i class="fa fa-comments"></i><span>Comments</span></a>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = { apiKey: "AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI", authDomain: "campus-bite-9dbaa.firebaseapp.com", projectId: "campus-bite-9dbaa" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  // HUB CONFIG (Technoscience Hall)
  const HUB_LAT = 2.999146339267604;
  const HUB_LNG = 30.926922100000002;
  const BASE_FEE = 500;
  const RATE_PER_KM = 350;

  const MERCHANT_MTN = "12345678"; 
  const MERCHANT_AIRTEL = "6984477"; 
  
  let netSelected = "";
  let subtotal = 0;
  let deliveryFee = 0;
  let methodSelected = "pickup";
  const cart = JSON.parse(localStorage.getItem("campusbite_budget_items_v1") || "{}");

  function init() {
    const container = document.getElementById("itemsContainer");
    if (Object.keys(cart).length === 0) { window.location.href = "home.html"; return; }

    Object.keys(cart).forEach(name => {
      const item = cart[name];
      subtotal += (item.price * item.qty);
      container.innerHTML += `<div class="order-card"><img src="${item.img || '/images/tent.jpeg'}" class="item-img"><div class="item-details"><strong>${name}</strong><br><span class="item-price">${item.qty}x — UGX ${(item.price * item.qty).toLocaleString()}</span></div></div>`;
    });
    updateUI();
  }

  function setMethod(m) {
    methodSelected = m;
    document.getElementById('btnPickup').classList.toggle('active', m === 'pickup');
    document.getElementById('btnDelivery').classList.toggle('active', m === 'delivery');
    document.getElementById('deliveryOptions').style.display = (m === 'delivery') ? 'block' : 'none';
    
    if (m === 'delivery') {
      calculateRate();
    } else {
      deliveryFee = 0;
      updateUI();
    }
  }

  function calculateRate() {
    const info = document.getElementById('distanceInfo');
    if (!navigator.geolocation) {
      deliveryFee = 1500;
      info.innerHTML = "GPS Unavailable. Fixed delivery: UGX 1,500";
      updateUI();
      return;
    }

    navigator.geolocation.getCurrentPosition(pos => {
      const R = 6371;
      const dLat = (pos.coords.latitude - HUB_LAT) * Math.PI / 180;
      const dLon = (pos.coords.longitude - HUB_LNG) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(HUB_LAT * Math.PI / 180) * Math.cos(pos.coords.latitude * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      const dist = R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));

      // Dynamic Math: Base + (Distance * Rate)
      let rawFee = BASE_FEE + (dist * RATE_PER_KM);
      // Round to nearest 100 for easy change
      deliveryFee = Math.ceil(rawFee / 100) * 100;
      if (deliveryFee > 5000) deliveryFee = 5000; // Cap at 5k

      info.innerHTML = `<i class="fa fa-route"></i> Distance: ${dist.toFixed(2)} km <br> Delivery Fee : <b>UGX ${deliveryFee.toLocaleString()}</b>`;
      updateUI();
    }, () => {
      deliveryFee = 1500;
      info.innerHTML = "Location Denied. Standard delivery: UGX 1,500";
      updateUI();
    });
  }

  function updateUI() {
    const total = subtotal + deliveryFee;
    document.getElementById("subTotalDisplay").innerText = "UGX " + subtotal.toLocaleString();
    document.getElementById("deliveryFeeDisplay").innerText = "UGX " + deliveryFee.toLocaleString();
    document.getElementById("finalTotalDisplay").innerText = "UGX " + total.toLocaleString();
    if(netSelected) setNet(netSelected);
    validate();
  }

  function toggleMomo() {
    document.getElementById("momoWizard").style.display = (document.getElementById("paymentMode").value === "Mobile Money") ? "block" : "none";
    validate();
  }

  function setNet(net) {
    netSelected = net;
    document.querySelectorAll('.net-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn'+net).classList.add('active');
    const total = subtotal + deliveryFee;
    let ussd = (net === 'MTN') ? `*165*3*${MERCHANT_MTN}*${total}#` : `*185*9*${MERCHANT_AIRTEL}*${total}#`;
    document.getElementById("ussdDisplay").innerText = ussd;
    document.getElementById("payNowBtn").href = "tel:" + ussd.replace(/#/g, "%23");
    document.getElementById("momoActions").style.display = "block";
    validate();
  }

  function validate() {
    const phone = document.getElementById("deliveryPhone").value.trim();
    const mode = document.getElementById("paymentMode").value;
    const tx = document.getElementById("transactionId").value.trim();
    const loc = document.getElementById("deliveryLocation").value.trim();
    let ok = phone.length >= 10;
    if (methodSelected === 'delivery') ok = ok && loc.length >= 2;
    if (mode === "Mobile Money") ok = ok && netSelected && tx.length > 5;
    document.getElementById("confirmOrderBtn").disabled = !ok;
  }

  async function placeOrder() {
    const user = auth.currentUser;
    if(!user) return alert("Auth error.");
    
    const btn = document.getElementById("confirmOrderBtn");
    btn.disabled = true;
    btn.innerText = "Processing...";

    try {
      // Step 1: Ensure User Doc exists
      await db.collection("orders").doc(user.uid).set({
        userName: user.displayName || "Muni Student",
        lastActivity: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });

      // Step 2: Add Subcollection Record
      await db.collection("orders").doc(user.uid).collection("userOrders").add({
        userId: user.uid,
        userName: user.displayName || "Muni Student",
        items: Object.keys(cart).map(k => ({ 
            name: k, 
            qty: cart[k].qty, 
            price: cart[k].price,
            image: cart[k].img || '/images/tent.jpeg' // History Page Image
        })),
        subtotal: subtotal,
        deliveryFee: deliveryFee,
        totalAmount: subtotal + deliveryFee,
        orderMethod: methodSelected,
        deliveryPhone: document.getElementById("deliveryPhone").value,
        deliveryLocation: methodSelected === 'delivery' ? document.getElementById("deliveryLocation").value : "Hub Pickup",
        paymentMode: document.getElementById("paymentMode").value,
        transactionId: document.getElementById("transactionId").value || "CASH",
        status: "pending",
        userSeen: false,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      localStorage.removeItem("campusbite_budget_items_v1");
      window.location.href = "order-history.html";
    } catch(e) { 
      alert(e.message); 
      btn.disabled = false; 
      btn.innerText = "Confirm My Order";
    }
  }

  init();
</script>
</body>
</html>
