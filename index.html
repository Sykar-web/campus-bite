<!DOCTYPE html>
<html lang="en">
<head>
  <title>Fast Food Delivery for Muni University Students</title>
  <meta name="description" content="Order your favorite meals from Muni University's #1 student food hub. Fast delivery to hostels, easy payment, and exclusive student discounts.">
  <meta name="keywords" content="Muni University, Food Delivery, Campus Bite, Student Hub, Arua Food, University Meals">
  <meta name="author" content="Campus Bite Team">
  <meta property="og:title" content="Campus Bite | Muni University">
  <meta property="og:description" content="Hungry? Join the community and order food directly to your hostel. Fast, fresh, and made for students.">
  <meta property="og:image" content="https://campusbite.xyz/images/tent.jpeg">
  <meta property="og:url" content="https://campusbite.xyz">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Campus Bite | Muni University Food Hub">
  <meta name="twitter:description" content="The fastest way to get food on campus. Join the Hub today!">
  <meta name="twitter:image" content="https://campusbite.xyz/images/tent.jpeg">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff914d">
  <link rel="icon" href="/images/tent.jpeg" type="image/jpeg">
  <link rel="apple-touch-icon" href="/images/tent.jpeg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --brand: #ff914d;
      --brand-dark: #e67e39;
      --text-main: #1a1a1a;
      --text-muted: #666;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-color: #000;
      position: relative;
    }

    .bg-wrapper { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
    .moving-bg {
      width: 110%; height: 110%; position: absolute; top: -5%; left: -5%;
      background: url("https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1950&q=80") center/cover no-repeat;
      animation: kenBurns 20s infinite alternate ease-in-out;
    }
    @keyframes kenBurns { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
    .overlay { position: fixed; inset: 0; z-index: -1; background: rgba(0, 0, 0, 0.5); }

    .login-container { width: 100%; max-width: 420px; padding: 20px; z-index: 2; }
    .auth-card {
      background: rgba(255, 255, 255, 0.98); /* Slightly more opaque for faster rendering */
      backdrop-filter: blur(15px);
      padding: 40px 35px;
      border-radius: 30px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      text-align: center;
    }

    .brand-logo { width: 75px; height: 75px; border-radius: 20px; margin-bottom: 20px; object-fit: cover; }
    .auth-card h1 { font-family: 'Poppins', sans-serif; font-size: 1.8rem; color: var(--text-main); margin-bottom: 8px; }
    
    .input-wrapper { position: relative; margin-bottom: 15px; text-align: left; }
    .input-wrapper i.field-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 1rem; }
    .input-wrapper input {
      width: 100%; padding: 14px 45px;
      border: 1.5px solid #eee; border-radius: 12px;
      font-size: 16px; outline: none; background: #fafafa;
    }
    .input-wrapper input:focus { border-color: var(--brand); background: #fff; }

    /* ALL BUTTONS UNLOCKED - NO FILTERS OR OPACITY */
    .primary-btn { width: 100%; padding: 15px; background: var(--brand); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .google-btn { 
      width: 100%; padding: 14px; background: #fff; color: #444; 
      border: 1.5px solid #ddd; border-radius: 12px; font-weight: 600; 
      cursor: pointer; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .secondary-btn { width: 100%; padding: 14px; background: transparent; color: var(--brand); border: 1.5px solid var(--brand); border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 12px; }
    .forgot-link { display: inline-block; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
  </style>
</head>

<body>
  <div class="bg-wrapper"><div class="moving-bg"></div></div>
  <div class="overlay"></div>

  <div class="login-container">
    <div class="auth-card">
      <img src="/images/tent.jpeg" class="brand-logo" alt="Logo">
      <h1 id="welcomeText">Welcome Back</h1>
      <p style="color:#777; font-size: 0.9rem; margin-bottom: 25px;">Muni University's Student Food Hub</p>

      <div class="input-wrapper">
        <i class="fa-regular fa-envelope field-icon"></i>
        <input type="email" id="email" placeholder="Email" />
      </div>

      <div class="input-wrapper">
        <i class="fa-solid fa-lock field-icon"></i>
        <input type="password" id="password" placeholder="Password" />
      </div>

      <button class="primary-btn" id="emailLoginBtn">Sign In</button>
      <button class="google-btn" id="googleLoginBtn"><i class="fa-brands fa-google" style="color:#4285F4"></i> Continue with Google</button>
      <button class="secondary-btn" id="joinBtn">Join Campus Bite</button>
      <span class="forgot-link" id="forgotBtn">Forgot your password?</span>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, signInWithEmailAndPassword, onAuthStateChanged, 
      setPersistence, browserLocalPersistence, GoogleAuthProvider, signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI",
      authDomain: "campus-bite-9dbaa.firebaseapp.com",
      projectId: "campus-bite-9dbaa",
      storageBucket: "campus-bite-9dbaa.appspot.com",
      messagingSenderId: "294389261625",
      appId: "1:294389261625:web:095d6e5f85f4e8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // SPEED FIX: Instant local persistence
    setPersistence(auth, browserLocalPersistence);

    // DYNAMIC WELCOME
    if (!localStorage.getItem("hasLoggedInBefore")) {
      document.getElementById("welcomeText").innerText = "Join the Hub";
    }

    // AUTH OBSERVER: Fast Redirect
    onAuthStateChanged(auth, (user) => {
      if (user) {
        localStorage.setItem("hasLoggedInBefore", "true");
        // ULTRA-SPEED: Redirect immediately. 
        // Move your Firestore doc creation/checks to home.html to save login time!
        window.location.replace("home.html");
      }
    });

    // EMAIL LOGIN
    document.getElementById("emailLoginBtn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value.trim();
      const btn = document.getElementById("emailLoginBtn");

      if (!email || !pass) return alert("Fill in all fields.");
      btn.innerText = "Authenticating...";
      btn.disabled = true;

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        alert("Login Failed: " + e.message);
        btn.innerText = "Sign In";
        btn.disabled = false;
      }
    };

    // GOOGLE LOGIN
    document.getElementById("googleLoginBtn").onclick = async () => {
      try { await signInWithPopup(auth, provider); } catch (e) { console.log("Google closed"); }
    };

    document.getElementById("joinBtn").onclick = () => window.location.href = "signup.html";
    document.getElementById("forgotBtn").onclick = () => alert("Check your email for reset instructions.");

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
