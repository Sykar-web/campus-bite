<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Campus Bite</title>
  
  <link rel="icon" href="images/tent.jpeg" type="image/jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root {
      --brand: #ff914d;
      --brand-dark: #e67e39;
      --text-main: #1a1a1a;
      --text-muted: #666;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-color: #000;
      position: relative;
    }

    /* --- THE MOVING BACKGROUND LOGIC --- */
    .bg-wrapper {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
    }

    .moving-bg {
      width: 110%; /* Slightly larger to allow for movement without showing edges */
      height: 110%;
      position: absolute;
      top: -5%;
      left: -5%;
      background: url("https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1950&q=80") center/cover no-repeat;
      animation: kenBurns 20s infinite alternate ease-in-out;
    }

    @keyframes kenBurns {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.1) translate(-2%, -2%); }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(0, 0, 0, 0.5); /* Semi-transparent dark layer */
    }

    /* --- LOGIN CARD --- */
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      z-index: 2;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(15px);
      padding: 50px 40px;
      border-radius: 30px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .brand-logo {
      width: 75px; height: 75px; border-radius: 20px;
      margin-bottom: 20px; object-fit: cover;
      box-shadow: 0 8px 15px rgba(255, 145, 77, 0.3);
    }

    .auth-card h1 {
      font-family: 'Poppins', sans-serif; font-size: 1.8rem;
      color: var(--text-main); margin-bottom: 8px;
    }

    .input-wrapper { position: relative; margin-bottom: 18px; text-align: left; }
    .input-wrapper i.field-icon {
      position: absolute; left: 15px; top: 50%;
      transform: translateY(-50%); color: #aaa; font-size: 1rem;
    }

    .input-wrapper input {
      width: 100%; padding: 14px 15px 14px 45px;
      border: 1.5px solid #eee; border-radius: 12px;
      font-size: 0.95rem; outline: none; transition: 0.3s; background: #fafafa;
    }

    .input-wrapper input:focus { border-color: var(--brand); background: #fff; }

    .primary-btn {
      width: 100%; padding: 15px; background: var(--brand); color: white;
      border: none; border-radius: 12px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: 0.3s; margin-top: 10px;
    }

    .secondary-btn {
      width: 100%; padding: 14px; background: transparent; color: var(--brand);
      border: 1.5px solid var(--brand); border-radius: 12px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 12px;
    }

    .forgot-link { display: inline-block; margin-top: 25px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
  </style>
</head>
<body>

  <div class="bg-wrapper">
    <div class="moving-bg"></div>
  </div>
  <div class="overlay"></div>

  <div class="login-container">
    <div class="auth-card">
      <img src="images/tent.jpeg" class="brand-logo" alt="Logo">
      <h1>Welcome Back</h1>
      <p style="color:#777; font-size: 0.9rem; margin-bottom: 30px;">Muni University's Student Food Hub</p>

      <div class="input-wrapper">
        <i class="fa-regular fa-envelope field-icon"></i>
        <input type="email" id="email" placeholder="Student Email" />
      </div>

      <div class="input-wrapper">
        <i class="fa-solid fa-lock field-icon"></i>
        <input type="password" id="password" placeholder="Password" />
      </div>

      <button class="primary-btn" id="loginBtn">Sign In</button>
      <button class="secondary-btn" id="signupBtn">Join Campus Bite</button>
      
      <span class="forgot-link" id="forgotBtn">Forgot your password?</span>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI",
      authDomain: "campus-bite-9dbaa.firebaseapp.com",
      projectId: "campus-bite-9dbaa",
      storageBucket: "campus-bite-9dbaa.appspot.com",
      messagingSenderId: "294389261625",
      appId: "1:294389261625:web:095d6e5f85f4e8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "home.html";
    });

    document.getElementById("loginBtn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value.trim();
      const btn = document.getElementById("loginBtn");

      if (!email || !pass) return alert("Please fill in all fields.");
      
      btn.disabled = true;
      btn.innerText = "Authenticating...";

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        alert("Login Failed. Please check your credentials.");
        btn.disabled = false;
        btn.innerText = "Sign In";
      }
    };

    document.getElementById("signupBtn").onclick = () => window.location.href = "signup.html";
  </script>
</body>
</html>
