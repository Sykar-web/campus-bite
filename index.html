<!DOCTYPE html>
<html lang="en">
<head>
  <title>Fast Food Delivery for Muni University Students</title>
  <meta name="description" content="Order your favorite meals from Muni University's #1 student food hub. Fast delivery to hostels, easy payment, and exclusive student discounts.">
  <meta name="keywords" content="Muni University, Food Delivery, Campus Bite, Student Hub, Arua Food, University Meals">
  <meta name="author" content="Campus Bite Team">
  <meta property="og:title" content="Campus Bite | Muni University">
  <meta property="og:description" content="Hungry? Join the community and order food directly to your hostel. Fast, fresh, and made for students.">
  <meta property="og:image" content="https://campusbite.xyz/images/tent.jpeg">
  <meta property="og:url" content="https://campusbite.xyz">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Campus Bite | Muni University Food Hub">
  <meta name="twitter:description" content="The fastest way to get food on campus. Join the Hub today!">
  <meta name="twitter:image" content="https://campusbite.xyz/images/tent.jpeg">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff914d">
  <link rel="icon" href="/images/tent.jpeg" type="image/jpeg">
  <link rel="apple-touch-icon" href="/images/tent.jpeg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --brand: #ff914d;
      --brand-dark: #e67e39;
      --text-main: #1a1a1a;
      --text-muted: #666;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-color: #000;
      position: relative;
    }

    /* Moving Background */
    .bg-wrapper { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
    .moving-bg {
      width: 110%; height: 110%; position: absolute; top: -5%; left: -5%;
      background: url("https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1950&q=80") center/cover no-repeat;
      animation: kenBurns 20s infinite alternate ease-in-out;
    }
    @keyframes kenBurns { 0% { transform: scale(1) translate(0, 0); } 100% { transform: scale(1.1) translate(-2%, -2%); } }
    .overlay { position: fixed; inset: 0; z-index: -1; background: rgba(0, 0, 0, 0.5); }

    /* Login Card */
    .login-container { width: 100%; max-width: 420px; padding: 20px; z-index: 2; }
    .auth-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(15px);
      padding: 40px 35px;
      border-radius: 30px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .brand-logo { width: 75px; height: 75px; border-radius: 20px; margin-bottom: 20px; object-fit: cover; box-shadow: 0 8px 15px rgba(255, 145, 77, 0.3); }
    .auth-card h1 { font-family: 'Poppins', sans-serif; font-size: 1.8rem; color: var(--text-main); margin-bottom: 8px; }
    
    .input-wrapper { position: relative; margin-bottom: 15px; text-align: left; }
    .input-wrapper i.field-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 1rem; }
    
    .eye-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #aaa; transition: 0.2s; }
    .eye-icon:hover { color: var(--brand); }

    .input-wrapper input {
      width: 100%; padding: 14px 45px;
      border: 1.5px solid #eee; border-radius: 12px;
      font-size: 16px; outline: none; transition: 0.3s; background: #fafafa;
    }
    .input-wrapper input:focus { border-color: var(--brand); background: #fff; }

    /* Button Styles and Locked State */
    .primary-btn { width: 100%; padding: 15px; background: var(--brand); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    
    .google-btn { 
      width: 100%; padding: 14px; background: #fff; color: #444; 
      border: 1.5px solid #ddd; border-radius: 12px; font-size: 0.9rem; 
      font-weight: 600; cursor: pointer; transition: 0.3s; 
      margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .google-btn:hover { background: #f8f8f8; border-color: #bbb; }
    .google-btn i { color: #4285F4; font-size: 1.1rem; }

    .secondary-btn { width: 100%; padding: 14px; background: transparent; color: var(--brand); border: 1.5px solid var(--brand); border-radius: 12px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 12px; }
    
    .forgot-link { display: inline-block; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; text-decoration: none; }
    .forgot-link:hover { color: var(--brand); }

    /* Class used by guard.js to unlock buttons 
    .locked {
      opacity: 0.5;
      filter: grayscale(1);
      cursor: not-allowed !important;
    }*/
  </style>
</head>

<body>

  <div class="bg-wrapper">
    <div class="moving-bg"></div>
  </div>
  <div class="overlay"></div>

  <div class="login-container">
    <div class="auth-card">
      <img src="/images/tent.jpeg" class="brand-logo" alt="Logo">
      <h1 id="welcomeText">Welcome Back</h1>
      <p style="color:#777; font-size: 0.9rem; margin-bottom: 25px;">Muni University's Student Food Hub</p>

      <div class="input-wrapper">
        <i class="fa-regular fa-envelope field-icon"></i>
        <input type="email" id="email" placeholder="Email" />
      </div>

      <div class="input-wrapper">
        <i class="fa-solid fa-lock field-icon"></i>
        <input type="password" id="password" placeholder="Password" />
        <i class="fa-regular fa-eye eye-icon" id="togglePassword"></i>
      </div>

      <button class="primary-btn unlocked" id="emailLoginBtn" enabled>Sign In</button>
      
      <button class="google-btn locked" id="googleLoginBtn" enabled>
        <i class="fa-brands fa-google"></i> Continue with Google
      </button>

      <button class="secondary-btn unlocked" id="joinBtn" enabled>Join Campus Bite</button>
      
      <span class="forgot-link" id="forgotBtn">Forgot your password?</span>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      onAuthStateChanged,
      sendPasswordResetEmail,
      GoogleAuthProvider,
      signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI",
      authDomain: "campus-bite-9dbaa.firebaseapp.com",
      projectId: "campus-bite-9dbaa",
      storageBucket: "campus-bite-9dbaa.appspot.com",
      messagingSenderId: "294389261625",
      appId: "1:294389261625:web:095d6e5f85f4e8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // DYNAMIC WELCOME LOGIC
    const welcomeHeader = document.getElementById("welcomeText");
    if (!localStorage.getItem("hasLoggedInBefore")) {
      welcomeHeader.innerText = "Join the Hub";
    }

    // UPDATED: THE AUTO-SYNC LISTENER
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        localStorage.setItem("hasLoggedInBefore", "true");
        
        const studentRef = doc(db, "students", user.uid);
        const studentSnap = await getDoc(studentRef);

        if (!studentSnap.exists()) {
          await setDoc(studentRef, {
            name: user.displayName || "Anonymous Student",
            email: user.email,
            profilePic: user.photoURL || "",
            uid: user.uid,
            role: "student",
            joinedAt: serverTimestamp(),
            hostel: "Not Set",
            phone: user.phoneNumber || ""
          });
        }
        
        setTimeout(() => {
            window.location.href = "home.html";
        }, 500);
      }
    });

    // EMAIL LOGIN
    document.getElementById("emailLoginBtn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value.trim();
      const btn = document.getElementById("emailLoginBtn");

      if (!email || !pass) return alert("Please fill in all fields.");
      btn.disabled = true;
      btn.innerText = "Authenticating...";

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        alert("Login Failed: " + e.message);
        btn.disabled = false;
        btn.innerText = "Sign In";
      }
    };

    // GOOGLE LOGIN
    document.getElementById("googleLoginBtn").onclick = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (e) {
        if (e.code !== 'auth/popup-closed-by-user') {
          alert("Google Sign-In Error: " + e.message);
        }
      }
    };

    // FORGOT PASSWORD
    document.getElementById("forgotBtn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      if (!email) return alert("Please enter your email address first.");
      
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) return alert("Please enter a valid email.");

      if (confirm(`Send a reset link to ${email}?`)) {
        try {
          await sendPasswordResetEmail(auth, email);
          alert("Reset link sent! Check your Inbox and Spam folder.");
        } catch (e) {
          alert("Error: " + e.message);
        }
      }
    };

    // NAVIGATION
    document.getElementById("joinBtn").onclick = () => window.location.href = "signup.html";

    // PASSWORD TOGGLE
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    togglePassword.onclick = () => {
      const type = passwordInput.type === "password" ? "text" : "password";
      passwordInput.type = type;
      togglePassword.classList.toggle("fa-eye");
      togglePassword.classList.toggle("fa-eye-slash");
    };

    // SERVICE WORKER REGISTRATION
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { 
        navigator.serviceWorker.register('/sw.js').catch(err => console.log("SW failed", err)); 
      });
    }
  </script>
  <script src="./security.js" defer></script>
</body>
</html>
