<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://campusbite.xyz/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Community Chat | Campus Bite</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <link rel="icon" href="/images/tent.jpeg" type="image/jpeg" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff914d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root { --primary: #ff914d; --bg: #f5f7fb; --text: #333; --white: #ffffff; }
    
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body { 
      height: 100dvh; 
      width: 100%; 
      overflow: hidden; 
      background: var(--bg);
    }

    body {
      font-family: "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
    }

    header { 
      background: var(--primary); color: #fff; padding: 15px 20px; 
      padding-top: calc(15px + env(safe-area-inset-top));
      display: flex; align-items: center; z-index: 1000;
      flex-shrink: 0;
    }
    .header-logo { width: 30px; height: 30px; border-radius: 6px; margin-right: 12px; }
    header h1 { font-size: 1rem; flex-grow: 1; }

    .comments-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .comment-bubble {
      max-width: 85%;
      padding: 10px 14px;
      background: var(--white);
      border-radius: 4px 18px 18px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      position: relative;
      transition: transform 0.2s ease;
    }

    .my-message { align-self: flex-end; background: #fff0e6; border-radius: 18px 4px 18px 18px; }
    .admin-message { border: 1px solid var(--primary); background: #fffaf0; }
    .admin-badge { background: var(--primary); color: white; font-size: 0.5rem; padding: 2px 5px; border-radius: 4px; margin-left: 5px; text-transform: uppercase; }

    .comment-user { font-weight: 700; color: var(--primary); font-size: 0.75rem; margin-bottom: 2px; display: block; }
    .comment-body { font-size: 0.9rem; color: #444; line-height: 1.4; word-wrap: break-word; }

    .quoted-container {
      background: rgba(0,0,0,0.06); border-left: 3px solid var(--primary);
      padding: 6px 10px; border-radius: 6px; margin-bottom: 8px; font-size: 0.75rem; color: #666;
    }

    .comment-footer { display: flex; gap: 15px; margin-top: 6px; font-size: 0.7rem; align-items: center; }
    .time-stamp { color: #ccc; margin-left: auto; font-size: 0.6rem; white-space: nowrap; }

    #replyPreview { 
      display: none; background: white; padding: 10px 20px; border-top: 2px solid var(--primary);
      font-size: 0.8rem; position: relative; animation: slideUp 0.3s ease;
    }
    #replyPreview i { position: absolute; right: 20px; top: 12px; color: #999; cursor: pointer; }

    .input-container-group {
      background: #fff;
      z-index: 1001;
      border-top: 1px solid #eee;
      margin-bottom: calc(60px + env(safe-area-inset-bottom)); 
    }

    .comment-input-section {
      display: flex; gap: 10px; padding: 10px 15px; align-items: center;
    }

    .comment-input-section input {
      flex: 1; padding: 12px 18px; border-radius: 25px;
      border: 1px solid #ddd; background: #f9f9f9; outline: none; font-size: 16px;
    }

    .comment-input-section button {
      background: var(--primary); color: #fff; border: none;
      border-radius: 50%; width: 45px; height: 45px; display: flex;
      align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
    }

    .footer-nav { 
      position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; 
      display: flex; justify-content: space-around; 
      padding: 10px 0;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 15px rgba(0,0,0,0.05); z-index: 1002; 
    }
    .footer-nav a { text-decoration: none; color: #ccc; display: flex; flex-direction: column; align-items: center; font-size: 0.65rem; }
    .footer-nav a i { font-size: 1.2rem; margin-bottom: 4px; }
    .footer-nav a.active { color: var(--primary); font-weight: 600; }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  </style>
</head>
<body>

<header>
  <img src="/images/tent.jpeg" class="header-logo">
  <h1>Community Chat</h1>
</header>

<div class="comments-wrapper" id="commentsContainer">
    <div style="text-align:center; padding:20px; color:#aaa;">Connecting...</div>
</div>

<div class="input-container-group">
    <div id="replyPreview">
        <span>Replying to <b id="replyToName"></b></span>
        <p id="replyToText" style="color:#888; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></p>
        <i class="fa fa-times" onclick="cancelReply()"></i>
    </div>
    <div class="comment-input-section">
      <input type="text" id="commentInput" placeholder="Message..." autocomplete="off"/>
      <button id="postCommentBtn"><i class="fa fa-paper-plane"></i></button>
    </div>
</div>

<nav class="footer-nav">
  <a href="profile.html"><i class="fa fa-user"></i><span>Profile</span></a>
  <a href="home.html"><i class="fa fa-utensils"></i><span>Menu</span></a>
  <a href="budget.html"><i class="fa fa-shopping-cart"></i><span>Cart</span></a>
  <a href="order-history.html"><i class="fa fa-list"></i><span>My Orders</span></a>
  <a href="comments.html" class="active"><i class="fa fa-comments"></i><span>Chat</span></a>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI",
  authDomain: "campus-bite-9dbaa.firebaseapp.com",
  projectId: "campus-bite-9dbaa"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const container = document.getElementById("commentsContainer");
const input = document.getElementById("commentInput");
const btn = document.getElementById("postCommentBtn");

const ADMIN_EMAIL = "ezrasykar@gmail.com";
let activeReply = null;

// NEW: Enhanced Date + Time Logic
function formatTime(date) {
  if (!date) return "Now";
  const msgDate = date.toDate();
  const now = new Date();

  const isToday = msgDate.getDate() === now.getDate() &&
                  msgDate.getMonth() === now.getMonth() &&
                  msgDate.getFullYear() === now.getFullYear();

  const timeStr = msgDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  if (isToday) {
    return timeStr;
  } else {
    const dateStr = msgDate.toLocaleDateString([], { month: 'short', day: 'numeric' });
    return `${dateStr}, ${timeStr}`;
  }
}

function scrollToBottom() {
  container.scrollTop = container.scrollHeight;
}

function setupAdminSwipe(el, name, text) {
  const user = auth.currentUser;
  if (!user || user.email !== ADMIN_EMAIL) return;

  let startX;
  el.addEventListener('touchstart', e => startX = e.touches[0].clientX);
  el.addEventListener('touchmove', e => {
    let move = e.touches[0].clientX - startX;
    if (move > 0 && move < 70) {
      el.style.transform = `translateX(${move}px)`;
      if (move > 50) setReply(name, text);
    }
  });
  el.addEventListener('touchend', () => el.style.transform = `translateX(0)`);
  el.addEventListener('dblclick', () => setReply(name, text));
}

function setReply(name, text) {
  activeReply = { name, text };
  document.getElementById("replyPreview").style.display = "block";
  document.getElementById("replyToName").innerText = name;
  document.getElementById("replyToText").innerText = text;
  input.focus();
}

function cancelReply() {
  activeReply = null;
  document.getElementById("replyPreview").style.display = "none";
}

btn.onclick = async () => {
  const text = input.value.trim();
  if(!text) return;
  const user = auth.currentUser;
  if(!user) return alert("Please log in");

  btn.disabled = true;
  try {
    const studentDoc = await db.collection("students").doc(user.uid).get();
    let displayName = studentDoc.exists ? studentDoc.data().name : "Student";
    if(user.email === ADMIN_EMAIL) displayName = "Campus Bite ";

    await db.collection("comments").add({
      userId: user.uid,
      userEmail: user.email,
      userName: displayName,
      text: text,
      replyTo: activeReply,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    input.value = "";
    cancelReply();
    setTimeout(scrollToBottom, 100);
  } catch(e) { console.error(e); }
  btn.disabled = false;
};

input.addEventListener("keypress", (e) => { if (e.key === "Enter") btn.click(); });

auth.onAuthStateChanged(user => {
  db.collection("comments").orderBy("createdAt", "asc").limitToLast(50).onSnapshot(snap => {
    container.innerHTML = "";
    const uid = user?.uid;

    snap.forEach(doc => {
      const d = doc.data();
      const isMe = d.userId === uid;
      const isAdmin = d.userEmail === ADMIN_EMAIL;
      
      const bubble = document.createElement("div");
      bubble.className = `comment-bubble ${isMe ? 'my-message' : ''} ${isAdmin ? 'admin-message' : ''}`;

      setupAdminSwipe(bubble, d.userName, d.text);

      bubble.innerHTML = `
        <span class="comment-user">
          ${isMe ? 'Me' : d.userName} 
          ${isAdmin ? '<span class="admin-badge">Admin ✅</span>' : ''}
        </span>
        ${d.replyTo ? `<div class="quoted-container"><b>${d.replyTo.name}</b><br>${d.replyTo.text}</div>` : ''}
        <div class="comment-body">${d.text}</div>
        <div class="comment-footer">
          <span class="time-stamp">${formatTime(d.createdAt)}</span>
        </div>
      `;
      container.appendChild(bubble);
    });
    scrollToBottom();
  });
});
</script>
</body>
</html>
