<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://campusbite.xyz/">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My Orders | Campus Bite</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- App Icons -->
  <link rel="icon" href="images/tent.jpeg" type="image/jpeg"/>
  <link rel="apple-touch-icon" href="images/tent.jpeg"/>

  <meta name="theme-color" content="#ff914d"/>

  <style>
    :root{
      --bg:#fff8f1;
      --primary:#ff6a00;
      --primary-2:#ff914d;
      --text:#333;
      --muted:#555;
      --card:#fff;
      --accent:#4CAF50;
      --danger:#E53935;
      --radius:12px;
      --shadow:0 4px 12px rgba(0,0,0,.08);
      --shadow-hover:0 6px 16px rgba(0,0,0,.12);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Poppins,sans-serif;
      background:var(--bg);
      color:var(--text);
      display:flex;
      justify-content:center;
    }

    .container{
      max-width:640px;
      width:100%;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      padding:0 20px 20px;
    }

    /* App Bar */
    .appbar{
      position:sticky;
      top:0;
      background:var(--card);
      border-bottom:1px solid #eee;
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 16px;
      z-index:10;
    }
    .logo{
      width:32px;
      height:32px;
      border-radius:6px;
      object-fit:cover;
    }
    .title{
      font-weight:600;
      color:var(--primary);
    }
    .spacer{flex:1}
    .back-btn{
      text-decoration:none;
      color:var(--muted);
      font-weight:500;
      display:flex;
      align-items:center;
      gap:6px;
    }
    .back-btn:hover{color:var(--primary)}

    h1{
      text-align:center;
      color:var(--primary);
      margin:16px 0 6px;
      font-size:1.5rem;
    }
    .subtitle{
      text-align:center;
      color:var(--muted);
      font-size:.95rem;
      margin-bottom:12px;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
      margin:12px 0;
    }

    .order-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:8px;
      font-weight:600;
    }

    .status{
      padding:4px 10px;
      border-radius:20px;
      font-size:.8rem;
      font-weight:600;
      text-transform:capitalize;
    }
    .pending{background:#fff3e0;color:#ff6a00}
    .completed{background:#e8f5e9;color:#2e7d32}

    .item-row{
      display:flex;
      gap:10px;
      margin:8px 0;
      align-items:center;
    }
    .item-row img{
      width:60px;
      height:60px;
      border-radius:10px;
      object-fit:cover;
      background:#eee;
    }
    .item-info{
      flex:1;
      font-size:.9rem;
    }

    .summary{
      margin-top:8px;
      font-size:.9rem;
      line-height:1.5;
    }
    .summary strong{color:var(--primary)}

    .cancel-btn{
      margin-top:10px;
      background:var(--danger);
      color:#fff;
      border:none;
      border-radius:8px;
      padding:10px;
      font-weight:600;
      cursor:pointer;
      width:100%;
    }
    .cancel-btn:hover{opacity:.9}

    .pending-total{
      text-align:right;
      font-weight:600;
      color:var(--primary);
      margin:10px 0;
    }

    .empty{
      text-align:center;
      color:var(--muted);
      padding:20px;
    }

    #clear-history{
      margin:12px 0 20px;
      background:linear-gradient(135deg,var(--primary),var(--primary-2));
      color:#fff;
      border:none;
      border-radius:10px;
      padding:12px;
      font-weight:600;
      cursor:pointer;
      display:none;
    }

    /* Footer */
    footer{
      margin-top:auto;
      padding:20px;
      background:var(--card);
      border-top:1px solid #eee;
      text-align:center;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      font-size:.92rem;
      color:var(--muted);
    }

    .footer-nav{
      display:flex;
      justify-content:space-around;
      margin-bottom:14px;
      flex-wrap:wrap;
      gap:8px 14px;
    }

    .footer-nav a{
      text-decoration:none;
      color:#444;
      font-weight:500;
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:8px 10px;
      border-radius:8px;
    }

    .footer-nav a:hover{
      background:#f8f8f8;
      color:var(--primary);
    }

    .contact-info{
      margin-top:8px;
    }

    .contact-info a{
      color:var(--accent);
      text-decoration:none;
      font-weight:600;
    }

    .contact-info a:hover{
      text-decoration:underline;
    }

    .legal{
      margin-top:10px;
    }
  </style>
</head>

<body>
<div class="container">

  <!-- App Bar -->
  <div class="appbar">
    <img src="images/tent.jpeg" class="logo" alt="Campus Bite">
    <div class="title">Campus Bite</div>
    <div class="spacer"></div>
    <a href="/home.html" class="back-btn">
      <i class="fa fa-arrow-left"></i> Back
    </a>
  </div>

  <h1>My Orders</h1>
  <p class="subtitle">View and track your orders</p>

  <div id="pendingTotal" class="pending-total"></div>
  <div id="historyContainer"></div>
  <button id="clear-history">Clear Order History</button>

  <!-- Footer -->
  <footer>
    <nav class="footer-nav">
      <a href="/profile.html"><i class="fa fa-user"></i><span>Profile</span></a>
      <a href="/home.html"><i class="fa fa-utensils"></i><span>Menu</span></a>
      <a href="/confirm-order.html"><i class="fa fa-shopping-cart"></i><span>Cart</span></a>
      <a href="/order-history.html"><i class="fa fa-list"></i><span>My Orders</span></a>
      <a href="/comments.html"><i class="fa fa-comments"></i><span>Comments</span></a>
    </nav>

    <div class="contact-info">
      <p>📞 <a href="tel:+256748372023">+256 748 372 023</a></p>
      <p>✉️ <a href="mailto:campusbite@muni.ac.ug">campusbite@muni.ac.ug</a></p>
    </div>

    <p class="legal">
      © 2026 Campus Bite. All rights reserved.<br>
      Muni University | Arua, Uganda
    </p>
  </footer>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI",
  authDomain: "campus-bite-9dbaa.firebaseapp.com",
  projectId: "campus-bite-9dbaa",
  storageBucket: "campus-bite-9dbaa.appspot.com",
  messagingSenderId: "294389261625",
  appId: "1:294389261625:web:095d6e5f85f4e8"
};
if(!firebase.apps.length){ firebase.initializeApp(firebaseConfig); }
const auth = firebase.auth();
const db = firebase.firestore();

const historyContainer = document.getElementById("historyContainer");
const clearBtn = document.getElementById("clear-history");
const pendingTotalEl = document.getElementById("pendingTotal");
let ordersRef;

auth.onAuthStateChanged(user=>{
  if(!user){
    historyContainer.innerHTML =
      '<div class="empty">Please log in to view orders.</div>';
    return;
  }
  ordersRef = db.collection("orders")
    .doc(user.uid)
    .collection("userOrders")
    .orderBy("timestamp","desc");
  fetchOrders();
});

async function fetchOrders(){
  const snap = await ordersRef.get();
  historyContainer.innerHTML = "";
  if(snap.empty){
    historyContainer.innerHTML =
      '<div class="empty">No orders yet.</div>';
    return;
  }

  clearBtn.style.display = "block";
  let pendingTotal = 0;

  snap.forEach(doc=>{
    const o = doc.data();
    if(o.status === "pending") pendingTotal += o.totalAmount;

    const locationHTML =
      o.deliveryOption === "delivery" && o.deliveryLocation
        ? `<br>📍 Location: <strong>${o.deliveryLocation}</strong>`
        : "";

    const card = document.createElement("div");
    card.className = "card";

    let itemsHTML = "";
    o.items.forEach(i=>{
      itemsHTML += `
        <div class="item-row">
          <img src="${i.img || 'images/placeholder.png'}">
          <div class="item-info">
            <strong>${i.name}</strong><br>
            Qty: ${i.qty} × UGX ${i.price.toLocaleString()}
          </div>
        </div>`;
    });

    card.innerHTML = `
      <div class="order-header">
        <span>Order</span>
        <span class="status ${o.status}">${o.status}</span>
      </div>

      ${itemsHTML}

      <div class="summary">
        Total: <strong>UGX ${o.totalAmount.toLocaleString()}</strong><br>
        Delivery: ${o.deliveryOption}
        ${locationHTML}<br>
        Payment: ${o.paymentMode}
      </div>

      ${o.status === "pending"
        ? '<button class="cancel-btn">Cancel Order</button>'
        : ''}
    `;

    if(o.status === "pending"){
      card.querySelector(".cancel-btn").onclick = async ()=>{
        if(confirm("Cancel this order?")){
          await doc.ref.delete();
          fetchOrders();
        }
      };
    }

    historyContainer.appendChild(card);
  });

  pendingTotalEl.textContent =
    "Pending Total: UGX " + pendingTotal.toLocaleString();
}

clearBtn.onclick = async ()=>{
  if(!confirm("Delete all orders permanently?")) return;
  const snap = await ordersRef.get();
  const batch = db.batch();
  snap.forEach(d=>batch.delete(d.ref));
  await batch.commit();
  fetchOrders();
};
</script>
</body>
</html>
