<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://campusbite.xyz/">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>My Orders | Campus Bite</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="icon" href="images/tent.jpeg" type="image/jpeg"/>

  <style>
    :root{ --primary:#ff914d; --primary-dark:#ff6a00; --bg:#f8fafb; --text:#333; --muted:#888; --danger:#ff4d4d; --green:#2ecc71; --whatsapp:#25d366; }
    *{box-sizing:border-box; margin:0; padding:0;}
    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 110px; }

    header { 
      background: var(--primary); color: #fff; padding: 15px 20px; 
      display: flex; align-items: center; position: sticky; top: 0; z-index: 1000;
    }
    .header-logo { width: 35px; height: 35px; border-radius: 8px; margin-right: 12px; object-fit: cover; }
    header h1 { font-size: 1.1rem; flex-grow: 1; }
    .back-link { color: white; text-decoration: none; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.4); padding: 5px 12px; border-radius: 10px; }

    .main-content { padding: 20px; max-width: 800px; margin: 0 auto; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .page-title h2 { color: var(--primary-dark); font-size: 1.5rem; }
    .pending-total { background: #fff5ee; padding: 8px 15px; border-radius: 10px; font-weight: 600; color: var(--primary-dark); font-size: 0.85rem; border: 1px solid #ffe0cc; }

    #historyContainer { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 768px) { #historyContainer { grid-template-columns: 1fr 1fr; } }

    .card { background: #fff; border-radius: 25px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: 1px solid #eee; display: flex; flex-direction: column; position: relative; }
    .order-header { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; }
    
    .status { padding: 5px 12px; border-radius: 10px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }
    .pending { background: #fff9c4; color: #856404; }
    .preparing { background: #e3f2fd; color: #0d47a1; }
    .out-for-delivery { background: #f3e5f5; color: #4a148c; }
    .delivered { background: #e8f5e9; color: #1b5e20; }
    .cancelled { background: #ffebee; color: #b71c1c; }

    .paid-badge { background: var(--green); color: white; padding: 2px 8px; border-radius: 6px; font-size: 0.6rem; font-weight: 700; margin-left: 5px; }

    .item-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
    .item-row img { width: 45px; height: 45px; border-radius: 10px; object-fit: cover; background: #f9f9f9; }
    .item-info { flex: 1; font-size: 0.85rem; }

    .summary { background: #fafafa; padding: 14px; border-radius: 18px; font-size: 0.8rem; margin-top: auto; border: 1px solid #f0f0f0; }
    .summary-line { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .total-text { color: var(--primary-dark); font-size: 1rem; font-weight: 700; }

    /* Action Buttons */
    .action-area { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
    
    .whatsapp-btn { 
      background: var(--whatsapp); color: white; text-decoration: none; 
      padding: 12px; border-radius: 14px; font-size: 0.8rem; font-weight: 700; 
      display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s;
    }
    .whatsapp-btn:hover { opacity: 0.9; }

    .cancel-btn { 
      background: #fff1f1; color: var(--danger); border: 1px solid #ffcccc; 
      border-radius: 14px; padding: 12px; font-weight: 700; cursor: pointer; font-size: 0.8rem; 
    }
    .time-warning { font-size: 0.65rem; color: #aaa; text-align: center; display: block; }
    .urgent { color: var(--danger); font-weight: 600; }

    .footer-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 12px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); z-index: 2000; border-top-left-radius: 30px; border-top-right-radius: 30px; }
    .footer-nav a { text-decoration: none; color: #ccc; display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; }
    .footer-nav a i { font-size: 1.3rem; margin-bottom: 4px; }
    .footer-nav a.active { color: var(--primary); font-weight: 700; }

    .empty { text-align: center; padding: 80px 20px; color: #bbb; grid-column: 1 / -1; }
    .empty i { font-size: 4rem; margin-bottom: 15px; color: #eee; }
  </style>
</head>

<body>
<header>
  <img src="images/tent.jpeg" class="header-logo">
  <h1>Campus Bite</h1>
  <a href="home.html" class="back-link">Menu</a>
</header>

<div class="main-content">
  <div class="page-header">
    <div class="page-title">
      <h2>Order History</h2>
      <p id="subTitle">Track your active meals</p>
    </div>
    <div id="pendingTotal" class="pending-total" style="display:none;"></div>
  </div>

  <div id="historyContainer">
      <div class="empty"><i class="fa fa-circle-notch fa-spin"></i><br>Fetching orders...</div>
  </div>
  
  <div style="text-align: center; margin-top: 40px;">
    <button id="clear-history" style="display:none; background:none; border:none; color:#bbb; font-size:0.75rem; text-decoration:underline; cursor:pointer;">Clear Delivered History</button>
  </div>
</div>

<nav class="footer-nav">
  <a href="profile.html"><i class="fa fa-user"></i><span>Profile</span></a>
  <a href="home.html"><i class="fa fa-utensils"></i><span>Menu</span></a>
  <a href="confirm-order.html"><i class="fa fa-shopping-cart"></i><span>Cart</span></a>
  <a href="order-history.html" class="active"><i class="fa fa-list"></i><span>My Orders</span></a>
  <a href="comments.html"><i class="fa fa-comments"></i><span>Feedback</span></a>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyATGWLqyjWJUaDXwudubIc_Hvh5yPVDyOI",
  authDomain: "campus-bite-9dbaa.firebaseapp.com",
  projectId: "campus-bite-9dbaa",
  storageBucket: "campus-bite-9dbaa.appspot.com",
  messagingSenderId: "294389261625",
  appId: "1:294389261625:web:095d6e5f85f4e8"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// CONFIG: Your WhatsApp Support Number
const SUPPORT_PHONE = "256748372023"; 

auth.onAuthStateChanged(user => {
  if(user){
    db.collection("orders").doc(user.uid).collection("userOrders")
      .orderBy("timestamp", "desc")
      .onSnapshot(snap => { renderOrders(snap); });
  } else {
    window.location.href = "login.html";
  }
});

function renderOrders(snap) {
  const container = document.getElementById("historyContainer");
  container.innerHTML = "";
  
  if(snap.empty){
    container.innerHTML = '<div class="empty"><i class="fa fa-box-open"></i><p>No orders found.</p></div>';
    return;
  }

  let activeTotal = 0;
  let hasOldOrders = false;
  const now = new Date().getTime();

  snap.forEach(doc => {
    const o = doc.data();
    const id = doc.id;
    const status = o.status || 'pending';
    
    // Logic for 5-minute cancellation window
    const orderTime = o.timestamp ? o.timestamp.toDate().getTime() : now;
    const diffMins = (now - orderTime) / 1000 / 60;
    const canCancel = diffMins < 5 && status === "pending";

    if(status === 'pending' || status === 'preparing') activeTotal += (o.totalAmount || 0);
    if(status === 'delivered' || status === 'cancelled') hasOldOrders = true;

    const card = document.createElement("div");
    card.className = "card";

    let itemsHTML = (o.items || []).map(i => `
      <div class="item-row">
        <img src="${i.image || 'images/tent.jpeg'}" onerror="this.src='images/tent.jpeg'">
        <div class="item-info">
          <strong>${i.name}</strong>
          <span style="color:#888;">${i.qty}x • UGX ${(i.price * i.qty).toLocaleString()}</span>
        </div>
      </div>
    `).join('');

    const waLink = `https://wa.me/${SUPPORT_PHONE}?text=Inquiry regarding Order #${id.slice(-5).toUpperCase()}`;

    card.innerHTML = `
      <div class="order-header">
        <div>
          <span style="font-size:0.65rem; color:#bbb; font-weight:700;">#${id.slice(-5).toUpperCase()}</span><br>
          <small style="color:#888;">${o.timestamp ? o.timestamp.toDate().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : 'Just now'}</small>
        </div>
        <div>
          <span class="status ${status.replace(/\s+/g, '-')}">${status}</span>
          ${o.paymentStatus === 'Paid' ? '<span class="paid-badge">PAID</span>' : ''}
        </div>
      </div>
      
      ${itemsHTML}
      
      <div class="summary">
        <div class="summary-line"><span>Deliver to:</span><strong>${o.deliveryLocation || 'Pickup'}</strong></div>
        <div class="summary-line" style="margin-top:5px; border-top:1px solid #eee; padding-top:5px;">
          <span>Total:</span><span class="total-text">UGX ${(o.totalAmount || 0).toLocaleString()}</span>
        </div>
      </div>

      <div class="action-area">
        <a href="${waLink}" target="_blank" class="whatsapp-btn">
          <i class="fab fa-whatsapp"></i> Inquiry via WhatsApp
        </a>
        
        ${canCancel ? `
          <button class="cancel-btn" onclick="cancelOrder('${id}')">Cancel Order</button>
          <span class="time-warning urgent">Cancellation ends in ${Math.ceil(5 - diffMins)} mins</span>
        ` : (status === 'pending' ? '<span class="time-warning">Cancellation period expired</span>' : '')}
      </div>
    `;
    container.appendChild(card);
  });

  document.getElementById("pendingTotal").textContent = "Active: UGX " + activeTotal.toLocaleString();
  document.getElementById("pendingTotal").style.display = activeTotal > 0 ? "block" : "none";
  document.getElementById("clear-history").style.display = hasOldOrders ? "inline-block" : "none";
}

async function cancelOrder(id) {
  const user = auth.currentUser;
  const ref = db.collection("orders").doc(user.uid).collection("userOrders").doc(id);
  
  // Security check for time
  const doc = await ref.get();
  const orderTime = doc.data().timestamp.toDate().getTime();
  if ((new Date().getTime() - orderTime) / 1000 / 60 > 5) {
    alert("Time limit (5 mins) exceeded. Please contact support via WhatsApp to cancel.");
    return;
  }

  if(confirm("Cancel this order? Status will change to 'cancelled'.")){
    try {
      await ref.update({ status: "cancelled" });
      alert("Order Cancelled.");
    } catch(e) { alert("Error: " + e.message); }
  }
}

document.getElementById("clear-history").onclick = async () => {
  if(!confirm("Clear delivered/cancelled history?")) return;
  const user = auth.currentUser;
  const snap = await db.collection("orders").doc(user.uid).collection("userOrders").get();
  const batch = db.batch();
  snap.forEach(d => {
    if(d.data().status === 'delivered' || d.data().status === 'cancelled') batch.delete(d.ref);
  });
  await batch.commit();
};
</script>
</body>
</html>
